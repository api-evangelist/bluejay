openapi: 3.2.0
info:
  title: Bluejay Google Agents API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: google_agents
paths:
  /v1/integrations/google-agents/available:
    get:
      tags:
      - google_agents
      summary: List Available Google Agents
      description: List Google CES + DFCX agents visible via the org WIF, without persisting.
      operationId: list_available_google_agents_v1_integrations_google_agents_available_get
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Available Google Agents V1 Integrations Google Agents Available Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/integrations/google-agents/test-connection:
    post:
      tags:
      - google_agents
      summary: Verify Google Connection
      description: 'Prove the Google Agents connection and report which services Bluejay can reach.


        Credential order matches the runtime: pasted access token, then keyless

        federation, then a pasted service-account key. `method` says which one ran.


        Named `verify_*` rather than `test_*` so it isn''t mistaken for (or collected

        as) a test; the customer-facing route stays `/test-connection`.'
      operationId: verify_google_connection_v1_integrations_google_agents_test_connection_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Verify Google Connection V1 Integrations Google Agents Test Connection Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/integrations/google-agents/sync:
    post:
      tags:
      - google_agents
      summary: Sync Google Agents
      description: 'Trigger a synchronous sync of all Google CES + DFCX agents for the org.


        Returns a result dict with counts of created/updated/removed agents per provider,

        each agent the sync touched (``agents``: id, name, outcome, and error when it

        failed), the folder they land in, and any per-location errors.


        Accepts an optional JSON body. When ``sync_all`` is explicitly ``false`` and

        ``dfcx_agent_ids`` / ``ces_keys`` are provided, only those agents are synced

        and mark-removed is skipped. Any other body (or no body) triggers a full sync.'
      operationId: sync_google_agents_v1_integrations_google_agents_sync_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Sync Google Agents V1 Integrations Google Agents Sync Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
x-provenance:
  method: harvested
  publisher: Bluejay
  source: https://api.getbluejay.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
