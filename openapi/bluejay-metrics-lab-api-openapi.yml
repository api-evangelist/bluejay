openapi: 3.2.0
info:
  title: Bluejay Metrics Lab API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Metrics Lab
paths:
  /v1/metrics-lab/evaluate-conversation:
    post:
      tags:
      - Metrics Lab
      summary: Evaluate Conversation
      description: Queue a conversation (obs or sim) for evaluation in the metrics lab.
      operationId: evaluate_conversation_v1_metrics_lab_evaluate_conversation_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateConversationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateConversationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/metrics-lab/lab:
    post:
      tags:
      - Metrics Lab
      summary: Create Lab
      description: Create a new lab.
      operationId: create_lab_v1_metrics_lab_lab_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLabRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/metrics-lab/lab/{lab_id}:
    put:
      tags:
      - Metrics Lab
      summary: Update Lab
      description: Update a specific lab by ID.
      operationId: update_lab_v1_metrics_lab_lab__lab_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: lab_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lab Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLabRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Metrics Lab
      summary: Delete Lab
      description: Delete a specific lab by ID.
      operationId: delete_lab_v1_metrics_lab_lab__lab_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: lab_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lab Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLabResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Metrics Lab
      summary: Get Lab Detail
      description: 'Get a lab''s full state: conversations, metrics, AI annotations, human labels,

        and metric revisions with their AI evaluations.


        This is the read side of the iterate loop: poll it after queueing evaluations to

        observe results (each evaluation carries a ``status`` of QUEUED/EVALUATING/COMPLETED/…)

        and to compare a revision''s results against the base metric and human labels.'
      operationId: get_lab_detail_v1_metrics_lab_lab__lab_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: lab_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lab Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/metrics-lab/lab/{lab_id}/metrics:
    post:
      tags:
      - Metrics Lab
      summary: Add Metrics To Lab
      description: Add metrics to an existing lab.
      operationId: add_metrics_to_lab_v1_metrics_lab_lab__lab_id__metrics_post
      security:
      - HTTPBearer: []
      parameters:
      - name: lab_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lab Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMetricsToLabRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddMetricsToLabResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/metrics-lab/lab/{lab_id}/conversations:
    post:
      tags:
      - Metrics Lab
      summary: Add Conversations To Lab
      description: Add conversations to an existing lab.
      operationId: add_conversations_to_lab_v1_metrics_lab_lab__lab_id__conversations_post
      security:
      - HTTPBearer: []
      parameters:
      - name: lab_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lab Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConversationsToLabRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddConversationsToLabResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Metrics Lab
      summary: Remove Conversations From Lab
      description: Remove one or more conversations from an existing lab.
      operationId: remove_conversations_from_lab_v1_metrics_lab_lab__lab_id__conversations_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: lab_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lab Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveConversationsFromLabRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/metrics-lab/lab/{lab_id}/human-evaluation:
    put:
      tags:
      - Metrics Lab
      summary: Create Or Update Human Evaluation
      description: Create or update a human evaluation for a lab metric result.
      operationId: create_or_update_human_evaluation_v1_metrics_lab_lab__lab_id__human_evaluation_put
      security:
      - HTTPBearer: []
      parameters:
      - name: lab_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lab Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateHumanEvaluationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanEvaluationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/metrics-lab/lab/{lab_id}/metric-revisions:
    post:
      tags:
      - Metrics Lab
      summary: Create Metric Revision
      description: Create a new metric revision for a lab. Revision number is auto-incremented by DB trigger.
      operationId: create_metric_revision_v1_metrics_lab_lab__lab_id__metric_revisions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: lab_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lab Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMetricRevisionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricRevisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/metrics-lab/lab/{lab_id}/settings:
    put:
      tags:
      - Metrics Lab
      summary: Update Lab Settings
      description: Update lab settings, merging with existing settings to avoid overwriting other settings.
      operationId: update_lab_settings_v1_metrics_lab_lab__lab_id__settings_put
      security:
      - HTTPBearer: []
      parameters:
      - name: lab_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lab Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLabSettingsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLabSettingsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/metrics-lab/labs:
    get:
      tags:
      - Metrics Lab
      summary: List Labs
      description: List the organization's labs, newest first, with conversation/metric/revision counts.
      operationId: list_labs_v1_metrics_lab_labs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max labs per page
          default: 20
          title: Page Size
        description: Max labs per page
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page
        description: Page number (1-based)
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AddConversationsToLabResponse:
      properties:
        added_count:
          type: integer
          title: Added Count
          description: Number of conversations successfully added
        skipped_count:
          type: integer
          title: Skipped Count
          description: Number of conversations that were skipped (already existed)
        added_conversation_ids:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Added Conversation Ids
          description: List of conversation identifiers that were added
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable message about the operation
      type: object
      required:
      - added_count
      - skipped_count
      - added_conversation_ids
      title: AddConversationsToLabResponse
      description: Response model for adding conversations to a lab
    MetricRevisionResponse:
      properties:
        id:
          type: string
          title: Id
          description: Revision ID (UUID as string)
        lab_id:
          type: string
          title: Lab Id
          description: Lab ID (UUID as string)
        custom_metric_id:
          type: string
          title: Custom Metric Id
          description: Custom metric ID (UUID as string)
        revision_number:
          type: integer
          title: Revision Number
          description: Revision number (auto-incremented)
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the metric revision
        scoring_guidance:
          anyOf:
          - type: string
          - type: 'null'
          title: Scoring Guidance
          description: Scoring guidance for the metric revision
        eval_route:
          anyOf:
          - type: string
          - type: 'null'
          title: Eval Route
          description: Evaluation route
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: Model to use for evaluation
        audio_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Model
          description: Audio model to use for evaluation
        temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature
          description: Temperature for evaluation
        allow_not_applicable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Not Applicable
          description: Whether to allow 'not applicable' responses
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the revision was created
      type: object
      required:
      - id
      - lab_id
      - custom_metric_id
      - revision_number
      - created_at
      title: MetricRevisionResponse
      description: Response model for metric revision operations
    LabListItem:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
        conversation_count:
          type: integer
          title: Conversation Count
          default: 0
        metric_count:
          type: integer
          title: Metric Count
          default: 0
        revision_count:
          type: integer
          title: Revision Count
          default: 0
      type: object
      required:
      - id
      - name
      title: LabListItem
      description: One lab in the list view, with cheap junction counts.
    EvaluateConversationResponse:
      properties:
        status:
          type: string
          title: Status
          description: Status of the operation
        message:
          type: string
          title: Message
          description: Response message
        conversation_id:
          type: string
          title: Conversation Id
          description: ID of the conversation
        conversation_type:
          type: string
          title: Conversation Type
          description: Type of conversation
        metrics:
          items:
            $ref: '#/components/schemas/MetricEvaluationItem'
          type: array
          title: Metrics
          description: List of metrics with their evaluation IDs
      type: object
      required:
      - status
      - message
      - conversation_id
      - conversation_type
      - metrics
      title: EvaluateConversationResponse
      description: Pydantic model for evaluate-conversation response
    EvaluateConversationRequest:
      properties:
        lab_id:
          type: string
          format: uuid
          title: Lab Id
          description: Lab ID (UUID) for the evaluation
        conversation:
          $ref: '#/components/schemas/ConversationRequest'
          description: Conversation to evaluate
        metrics:
          $ref: '#/components/schemas/MetricsRequest'
          description: Metrics to use for evaluation
      type: object
      required:
      - lab_id
      - conversation
      - metrics
      title: EvaluateConversationRequest
      description: Pydantic model for evaluate-conversation request
    HumanEvaluationResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Whether the operation was successful
        message:
          type: string
          title: Message
          description: Response message
      type: object
      required:
      - success
      - message
      title: HumanEvaluationResponse
      description: Response model for human evaluation operations
    LabResponse:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier of the lab
        name:
          type: string
          title: Name
          description: Name of the lab
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the lab
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the lab was created
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
          description: When the lab was last updated
      type: object
      required:
      - id
      - name
      - created_at
      title: LabResponse
      description: Response model for lab operations
    ConversationItem:
      properties:
        call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Id
          description: Call ID (UUID as string)
        test_result_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Test Result Id
          description: Simulated conversation ID
      type: object
      title: ConversationItem
      description: Model for a conversation in create lab request
    LabAIEvaluationDetail:
      properties:
        id:
          type: string
          title: Id
        lab_metric_revision_id:
          type: string
          title: Lab Metric Revision Id
        call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Id
        test_result_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Test Result Id
        response_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Response Value
        reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
      type: object
      required:
      - id
      - lab_metric_revision_id
      title: LabAIEvaluationDetail
      description: An AI result produced by evaluating a metric *revision* on a conversation.
    CreateOrUpdateHumanEvaluationRequest:
      properties:
        custom_metric_id:
          type: string
          title: Custom Metric Id
          description: Custom metric ID (UUID as string)
        call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Id
          description: Call ID (UUID as string)
        test_result_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Test Result Id
          description: Simulated conversation ID
        human_response_value:
          type: string
          title: Human Response Value
          description: Human evaluation response value
        human_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Human Reasoning
          description: Human evaluator's reasoning for the score
      type: object
      required:
      - custom_metric_id
      - human_response_value
      title: CreateOrUpdateHumanEvaluationRequest
      description: Request model for creating or updating a human evaluation
    AddMetricsToLabRequest:
      properties:
        lab_id:
          type: string
          title: Lab Id
          description: Lab ID (UUID as string)
        metric_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Metric Ids
          description: List of custom metric IDs (UUIDs as strings) to add to the lab
        evaluate_conversations:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Evaluate Conversations
          description: Whether to evaluate conversations in the lab with the newly added metrics (copies existing evaluations where found, queues new evaluations only for metrics without results)
          default: false
      type: object
      required:
      - lab_id
      - metric_ids
      title: AddMetricsToLabRequest
      description: Request model for adding metrics to an existing lab
    LabHumanEvaluationDetail:
      properties:
        id:
          type: string
          title: Id
        custom_metric_id:
          type: string
          title: Custom Metric Id
        call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Id
        test_result_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Test Result Id
        human_response_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Human Response Value
        human_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Human Reasoning
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
      type: object
      required:
      - id
      - custom_metric_id
      title: LabHumanEvaluationDetail
      description: A human label for (metric, conversation) — the ground truth to align against.
    MetricsRequest:
      properties:
        type:
          type: string
          enum:
          - custom_metric
          - custom_metric_revision
          title: Type
          description: 'Type of metrics: ''custom_metric'' or ''custom_metric_revision'''
        custom_metric_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Custom Metric Ids
          description: List of custom metric IDs (required when type is 'custom_metric')
        custom_metric_revision_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Metric Revision Id
          description: Custom metric revision ID (required when type is 'custom_metric_revision')
      type: object
      required:
      - type
      title: MetricsRequest
      description: Pydantic model for metrics in evaluate-conversation request
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
