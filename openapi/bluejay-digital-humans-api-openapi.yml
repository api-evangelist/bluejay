openapi: 3.2.0
info:
  title: Bluejay Digital Humans API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Digital Humans
paths:
  /v1/create-digital-human:
    post:
      tags:
      - Digital Humans
      summary: Create Digital Human
      description: Create a new digital human.
      operationId: create_digital_human_v1_create_digital_human_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDigitalHumanRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/src__models__digital_humans__digital_human_response__DigitalHumanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/create-digital-humans:
    post:
      tags:
      - Digital Humans
      summary: Bulk Create Digital Humans
      description: 'Bulk create digital humans.


        All database operations are batched to O(1) round-trips regardless of input size.

        Items that fail validation are reported in `errors`; the rest proceed to creation.'
      operationId: bulk_create_digital_humans_v1_create_digital_humans_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateDigitalHumansRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateDigitalHumansResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/digital-human/{digital_human_id}:
    get:
      tags:
      - Digital Humans
      summary: Get Digital Human
      description: Get a digital human by ID.
      operationId: get_digital_human_v1_digital_human__digital_human_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: digital_human_id
        in: path
        required: true
        schema:
          type: integer
          title: Digital Human Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/src__models__digital_humans__digital_human_response__DigitalHumanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Digital Humans
      summary: Delete Digital Human
      description: Delete a digital human by ID.
      operationId: delete_digital_human_v1_digital_human__digital_human_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: digital_human_id
        in: path
        required: true
        schema:
          type: integer
          title: Digital Human Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalHumanResponseData'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/digital-human-by-test-name/{test_name}:
    get:
      tags:
      - Digital Humans
      summary: Get Digital Human By Test Name
      description: Get a digital human by test_name (returns first match within the org).
      operationId: get_digital_human_by_test_name_v1_digital_human_by_test_name__test_name__get
      security:
      - HTTPBearer: []
      parameters:
      - name: test_name
        in: path
        required: true
        schema:
          type: string
          title: Test Name
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/src__models__digital_humans__digital_human_response__DigitalHumanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/digital-humans-by-simulation/{simulation_id}:
    get:
      tags:
      - Digital Humans
      summary: Get Digital Humans By Simulation
      description: Get digital humans by simulation ID.
      operationId: get_digital_humans_by_simulation_v1_digital_humans_by_simulation__simulation_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: simulation_id
        in: path
        required: true
        schema:
          type: integer
          title: Simulation Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalHumansListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/digital-humans:
    get:
      tags:
      - Digital Humans
      summary: Get All Digital Humans
      description: Get all of your digital humans.
      operationId: get_all_digital_humans_v1_digital_humans_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max digital humans per page
          default: 20
          title: Page Size
        description: Max digital humans per page
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page
        description: Page number (1-based)
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DigitalHumanType'
          - type: 'null'
          description: Only digital humans of this type
          title: Type
        description: Only digital humans of this type
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only digital humans carrying this exact tag
          title: Tag
        description: Only digital humans carrying this exact tag
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDigitalHumansResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/digital-human/{digital_human_id}/run-history:
    get:
      tags:
      - Digital Humans
      summary: Get Digital Human Run History
      description: Every call a digital human has made, newest first, with pass/fail totals.
      operationId: get_digital_human_run_history_v1_digital_human__digital_human_id__run_history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: digital_human_id
        in: path
        required: true
        schema:
          type: integer
          title: Digital Human Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: How many calls to return.
          default: 100
          title: Limit
        description: How many calls to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: How many calls to skip.
          default: 0
          title: Offset
        description: How many calls to skip.
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalHumanRunHistoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/update-digital-human/{digital_human_id}:
    put:
      tags:
      - Digital Humans
      summary: Update Digital Human
      description: Update a digital human by ID.
      operationId: update_digital_human_v1_update_digital_human__digital_human_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: digital_human_id
        in: path
        required: true
        schema:
          type: integer
          title: Digital Human Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDigitalHumanRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/src__models__digital_humans__digital_human_response__DigitalHumanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/update-digital-humans:
    put:
      tags:
      - Digital Humans
      summary: Bulk Update Digital Humans
      operationId: bulk_update_digital_humans_v1_update_digital_humans_put
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateDigitalHumansRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateDigitalHumansResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/digital-human/{digital_human_id}/duplicate:
    post:
      tags:
      - Digital Humans
      summary: Duplicate Digital Human
      description: 'Duplicate a digital human at the database level.


        Copies every column of the source row (cloned voice, custom background noise,

        interruption/speaks-first configs, transcripts, audio quirks) plus its traits,

        scripted responses and expected tool calls — without re-validating stored

        values, so copies of voice-ambience or custom-noise digital humans always

        succeed. The copy starts without a phone number and always-on inactive.'
      operationId: duplicate_digital_human_v1_digital_human__digital_human_id__duplicate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: digital_human_id
        in: path
        required: true
        schema:
          type: integer
          title: Digital Human Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/DuplicateDigitalHumanRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/src__models__digital_humans__digital_human_response__DigitalHumanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/delete-digital-humans:
    delete:
      tags:
      - Digital Humans
      summary: Bulk Delete Digital Humans
      description: 'Bulk delete digital humans by ID.


        All database operations are batched to O(1) round-trips regardless of input size:

        1. Batch fetch live test cases with traits and scripted responses (single joined select)

        2. Batch soft delete test_cases (simulation links kept for restore)'
      operationId: bulk_delete_digital_humans_v1_delete_digital_humans_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: digital_human_ids
        in: query
        required: true
        schema:
          type: string
          description: 'Comma-separated list of digital human IDs to delete. Maximum 100 IDs. Example: 1,2,3'
          title: Digital Human Ids
        description: 'Comma-separated list of digital human IDs to delete. Maximum 100 IDs. Example: 1,2,3'
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteDigitalHumansResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/custom-background-noises:
    get:
      tags:
      - Digital Humans
      summary: List Custom Background Noises
      description: 'List the caller org''s custom background noises, oldest first.


        Each row carries usage_count (referencing digital humans) so the UI can warn

        before delete; the DELETE endpoint stays the authoritative guard.'
      operationId: list_custom_background_noises_v1_custom_background_noises_get
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomBackgroundNoise'
                title: Response List Custom Background Noises V1 Custom Background Noises Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Digital Humans
      summary: Create Custom Background Noise
      description: 'Register an already-uploaded noise. The path must live under the caller

        org''s upload prefix; the org is capped at MAX_CUSTOM_BACKGROUND_NOISES.'
      operationId: create_custom_background_noise_v1_custom_background_noises_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomBackgroundNoiseRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomBackgroundNoise'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/custom-background-noises/upload-url:
    post:
      tags:
      - Digital Humans
      summary: Create Custom Background Noise Upload Url
      description: 'Mint a one-time signed PUT URL for uploading a noise file directly to the

        skywatch bucket (org-scoped path). Upload the raw bytes to upload_url with

        HTTP PUT, then register storage_path via POST /custom-background-noises.'
      operationId: create_custom_background_noise_upload_url_v1_custom_background_noises_upload_url_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadUrlRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Custom Background Noise Upload Url V1 Custom Background Noises Upload Url Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/custom-background-noises/{noise_id}:
    patch:
      tags:
      - Digital Humans
      summary: Update Custom Background Noise
      description: Rename a noise. The storage_path is immutable (re-upload = new row).
      operationId: update_custom_background_noise_v1_custom_background_noises__noise_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: noise_id
        in: path
        required: true
        schema:
          type: string
          title: Noise Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomBackgroundNoiseRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomBackgroundNoise'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Digital Humans
      summary: Delete Custom Background Noise
      description: 'Remove a noise from the library. Blocked (409) while any digital human

        still references its storage_path. Never deletes the storage object.'
      operationId: delete_custom_background_noise_v1_custom_background_noises__noise_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: noise_id
        in: path
        required: true
        schema:
          type: string
          title: Noise Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Custom Background Noise V1 Custom Background Noises  Noise Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/generate-objectives:
    post:
      tags:
      - Digital Humans
      summary: Generate Objectives Endpoint
      description: Generate objectives for a test case from its intent.
      operationId: generate_objectives_endpoint_v1_generate_objectives_post
      security:
