            type: array
          - type: 'null'
          title: Customer Personas
          description: List of customer personas to be used in the simulation
          deprecated: true
        system_prompt:
          anyOf:
          - type: integer
            multipleOf: 2.0
            minimum: 0.0
          - type: 'null'
          title: System Prompt
          description: 'Number of digital humans to generate from the agent version''s locked system-prompt rules. Each rule is tested from both sides, so this is two per rule and must be even: one caller the agent must help, one it must push back on. A lower number covers fewer rules rather than half-testing every rule.'
          default: 0
        load_testing:
          anyOf:
          - type: integer
          - type: 'null'
          title: Load Testing
          description: Number of load testing calls
          default: 0
        red_teaming:
          anyOf:
          - type: integer
          - type: 'null'
          title: Red Teaming
          description: Number of red teaming calls
          default: 0
        red_team_attacks:
          anyOf:
          - $ref: '#/components/schemas/SocialEngineeringRedTeamConfig'
