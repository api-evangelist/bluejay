    DigitalHumanRequestData:
      properties:
        bluejay_as_code_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Bluejay As Code Id
          description: Stable code-addressable identifier
        intent:
          type: string
          title: Intent
          description: 'The scenario the digital human enacts, in ONE OR TWO SENTENCES: what this caller wants, not how to behave. It fills one slot in a prompt that ALREADY renders traits, verbosity, fluency, a not-the-agent guardrail and end-of-call instructions, so restating those here is duplicate prompt. Anything shaped like ''if the agent says X, do Y'' does not belong here — it belongs in a field, and prose makes it non-deterministic. Move it: case facts the agent may ask for (member ID, DOB, order number, policy number) to `traits`; lines that must be said verbatim, a keypad entry, or a deliberate pause to `scripted_responses`; who opens the call to `speaks_first_config`; language, accent, fluency, verbosity, background noise, audio quality, interruptions, hangup and silence behavior to their own fields; and lower `creativity` for repeatability. If you reach for ''correctly'', ''appropriately'' or ''successfully'' you are describing what the AGENT should do — that goes in `success_criteria`, not here. Leave empty when enriched_playback is set; the agent uses playback instead.'
          default: ''
        success_criteria:
          type: string
          title: Success Criteria
          description: 'The pass/fail condition for this one test, in ONE OR TWO observable outcomes the transcript can settle (e.g. ''the agent verified the member ID and booked a callback''). It is not a rubric: a scored checklist, a per-dimension score, or a condition you want graded on every call in the suite belongs in a custom metric (`create_custom_metrics`) attached to the simulation, not in this string. Describe the AGENT''s outcome here, never the digital human''s own actions — those are `intent`. Leave empty when enriched_playback is set; the agent uses playback instead.'
          default: ''
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Name of the digital human
        tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
          description: Tag for categorizing the digital human
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Full tag list (takes precedence over `tag`). Free-form labels; use `type` for voicemail, replay and the other kinds.
        type:
          anyOf:
          - $ref: '#/components/schemas/DigitalHumanType'
          - type: 'null'
          description: What kind of digital human this is. Set it instead of putting sentinel values in tags; tags are free-form labels. Legacy sentinel tags (e.g. 'voicemail-custom', or 'transcript_generated' + 'smart') still set it when this is omitted.
        system_prompt_rule_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: System Prompt Rule Ids
          description: Ids of the system-prompt rules this digital human covers, from generate.
        system_prompt_rule_quotes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: System Prompt Rule Quotes
          description: The quoted system-prompt rules this digital human covers, shown on its card.
        language:
          anyOf:
          - $ref: '#/components/schemas/LanguageType'
          - type: 'null'
          description: Language the digital human speaks
          default: en
        accent:
          anyOf:
          - $ref: '#/components/schemas/AccentType'
          - type: 'null'
          description: Accent of the digital human
        gender:
          anyOf:
          - $ref: '#/components/schemas/GenderType'
          - type: 'null'
          description: Gender of the digital human
        custom_voice_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Voice Id
          description: ElevenLabs voice_id of a cloned voice. When set, the agent speaks with this voice instead of the accent's stock voice (language/accent still drive prompts and STT).
        background_noise:
          anyOf:
          - $ref: '#/components/schemas/BackgroundNoiseType'
          - type: 'null'
          description: Type of background noise
          default: none
        custom_background_noise_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Background Noise Url
          description: Bucket-relative path of the uploaded custom background noise audio; required when background_noise is 'custom'
        voice_speed:
          anyOf:
          - $ref: '#/components/schemas/VoiceSpeedType'
          - type: 'null'
          description: Speed of the digital human's voice
          default: normal
        audio_quality:
          anyOf:
          - $ref: '#/components/schemas/AudioQualityType'
          - type: 'null'
          description: Audio quality of the digital human's voice
          default: high
        fluency:
          anyOf:
          - $ref: '#/components/schemas/FluencyType'
          - type: 'null'
          description: Fluency level of the digital human's speech
          default: native
        verbosity:
          anyOf:
          - $ref: '#/components/schemas/VerbosityType'
          - type: 'null'
          description: Verbosity level of the digital human's responses
          default: medium
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: Phone number for the digital human
        extension:
          anyOf:
          - type: string
          - type: 'null'
          title: Extension
          description: Extension dialed as DTMF after connecting when this DH calls an inbound agent
        outbound_text_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Outbound Text Number
          description: Outbound text number
        follow_up_sms_success_criteria:
          anyOf:
          - type: string
          - type: 'null'
          title: Follow Up Sms Success Criteria
          description: Criteria the captured follow-up SMS is graded against
        background_noise_volume:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Background Noise Volume
          description: Volume of background noise
          default: 0.8
        expected_tool_calls:
          anyOf:
          - items:
              $ref: '#/components/schemas/ExpectedToolCall'
            type: array
          - type: 'null'
          title: Expected Tool Calls
          description: Expected tool call outputs
        allow_end_call_tool:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow End Call Tool
          description: Allow the digital human to end the tool call
          default: true
        allow_silence_tool:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Silence Tool
          description: Allow the digital human to use the silence tool
          default: true
        allow_dtmf_tool:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Dtmf Tool
          description: Allow the digital human to use the DTMF tool
          default: true
        default_dtmf_or_voiced:
          anyOf:
          - $ref: '#/components/schemas/DtmfOrVoicedType'
          - type: 'null'
          default: voiced
        silence_tool_instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Silence Tool Instructions
          description: Tool instructions; use "default" for built-in behavior or custom text
          default: default
        endpointing_delay:
          anyOf:
          - type: number
          - type: 'null'
          title: Endpointing Delay
          description: Seconds the digital human waits before it replies. Named patience in the UI, and accepted under either name.
          default: 1.5
        creativity:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Creativity
          description: Model temperature for the digital human's own speech. Lower it (0.0-0.3) when you want the same call twice — regression tests and anything you will compare run over run. Keep it near the 0.7 default for exploratory or red-team cases.
          default: 0.7
        hangup_phrases:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Hangup Phrases
          description: Phrases that trigger hangup
        hangup_instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Hangup Instructions
          description: Freeform instructions for how/when to hang up. The literal string "default" (or null) keeps the tuned built-in end-of-call behavior, which already handles ordinary goodbyes; any other string REPLACES it, so write one only for a condition the default would miss.
        silence_timeout:
          anyOf:
          - type: integer
            minimum: 15.0
          - type: 'null'
          title: Silence Timeout
          description: Silence timeout in seconds
        role_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Role Description
          description: Who this caller is, in one short line (e.g. 'retiree on a family plan, not comfortable with phone menus'). It owns identity and disposition only. What they are calling about is `intent`; the facts they can recite are `traits`; how they sound is language/accent/fluency/verbosity. Never put internal or agent-side information here — the digital human only knows what a real caller would know.
        traits:
          anyOf:
          - items:
              $ref: '#/components/schemas/src__models__traits__trait__Trait'
            type: array
          - type: 'null'
          title: Traits
          description: 'Case facts THIS CALLER holds and can recite when the agent asks — member ID, DOB, order number, policy number, zip. Each is an org-level trait (name + BOOLEAN/STRING/DATE/NUMBER type + value), so the same fact stays a stable fixture across the suite instead of a number the model invents mid-call. Traits are the determinism lever: any case-specific value mentioned in `intent` prose should be a trait instead. They are NOT a place for internal or agent-side information (what the CRM holds, what the agent should look up or say, expected tool arguments, notes for the grader) — the schema has no notion of an internal trait, and a caller cannot know those. Expected tool arguments go in `expected_tool_calls`; grading notes go in `success_criteria` or a custom metric.'
        interruptions:
          anyOf:
          - $ref: '#/components/schemas/SimpleInterruptionConfig'
          - $ref: '#/components/schemas/KeywordsInterruptionConfig'
          - $ref: '#/components/schemas/ContextualInterruptionConfig'
          - type: 'null'
          title: Interruptions
          description: Interruption configuration for the digital human
        scripted_responses:
          anyOf:
          - items:
              $ref: '#/components/schemas/ScriptedResponse'
            type: array
          - type: 'null'
          title: Scripted Responses
          description: 'The ''if the agent says X, the caller does Y'' rules for this test, as data instead of prose. Reach for one whenever a reply must be identical every run: a verbatim line, a keypad entry (DTMF), or a deliberate silence. Each row pairs an agent utterance (`match_phrase`) with the response. Writing the same rule into `intent` makes it advisory; putting it here makes it deterministic.'
        scripted_responses_ordered:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Scripted Responses Ordered
          description: 'When true, scripted_responses run as a script in list order: only the next unfired one is armed, each fires once, and a blank match_phrase fires on the digital human''s next turn. When false (default) any scripted response fires whenever its match_phrase comes up.'
          default: false
        speaks_first_config:
          anyOf:
          - $ref: '#/components/schemas/SpeaksFirstConfig'
          - type: 'null'
          description: 'Who opens the call, and the caller''s opening line when it must be fixed. Owns the opener so it does not have to be described in `intent`. Read the `dynamic` field before setting a custom message: on an agent that greets callers, a dynamic custom opener is discarded and never heard.'
        original_transcript:
          anyOf:
          - type: string
          - type: 'null'
          title: Original Transcript
          description: Original transcript text to replay. When provided (and formatted_transcript not provided), utterances are extracted via LLM and used as the intent.
        formatted_transcript:
          anyOf:
          - items:
              additionalProperties:
                type: string
              type: object
            type: array
          - type: 'null'
          title: Formatted Transcript
          description: Pre-computed structured transcript as [{role, utterance}]. When provided, skips the format-transcript LLM call.
        enriched_playback:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Enriched Playback
          description: 'Workflow playbook v2 (JSON list). Speech steps use type "message" only. User: intent and/or exact_message. Agent: criteria and/or exact_match_text.'
        workflow_v2_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workflow V2 Id
          description: Source workflow_v2 UUID — set when this DH is generated from a workflow
        workflow_path_index:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Workflow Path Index
          description: 0-based path index within enumerate_workflow_v2_paths output
        tested_path:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tested Path
          description: Ordered names of the workflow path steps this DH was generated from (Generate-From-Workflow only).
        journey_steps:
          anyOf:
          - items:
              $ref: '#/components/schemas/JourneyStep'
            type: array
          - type: 'null'
          title: Journey Steps
        always_on_mode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Always On Mode
          description: Whether always-on mode is enabled
          default: false
        always_on_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Always On Active
          description: When true, this DH actively receives calls on phone_number. Defaults to True when phone_number is set.
        num_runs:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Num Runs
          description: Number of times this digital human is run per simulation run (run count).
          default: 1
        livekit_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Livekit Metadata
          description: LiveKit-specific configuration and metadata for this digital human
        test_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Test Name
          description: User-facing label for this digital human
        attack_vector:
          anyOf:
          - type: string
          - type: 'null'
          title: Attack Vector
          description: Attack tactic key from VECTOR_CATALOG. NULL for non-red-team.
        attack_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Attack Type
          description: Umbrella attack category (recon | social_engineering | prompt_injection | audio_native).
        attack_plan:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Attack Plan
          description: Crescendo escalation ladder {objective, breach_predicate, ladder}.
      type: object
      title: DigitalHumanRequestData
      description: Digital human data model for requests (without id and created_at).
    CustomBackgroundNoise:
      properties:
        id:
          type: string
          title: Id
        organization_id:
          type: string
          title: Organization Id
        name:
          type: string
          title: Name
        storage_path:
          type: string
          title: Storage Path
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
        usage_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Usage Count
      type: object
      required:
      - id
      - organization_id
      - name
      - storage_path
      title: CustomBackgroundNoise
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
