      - value
      title: Trait
      description: Model for a single trait.
    SpeaksFirstConfig:
      properties:
        speaks_first:
          type: boolean
          title: Speaks First
          description: Whether the digital human speaks first in the call
        mode:
          anyOf:
          - type: string
            enum:
            - custom
            - ai_generated
          - type: 'null'
          title: Mode
          description: 'When speaks_first is true: ''custom'' (user-provided message) or ''ai_generated'' (no message)'
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: When mode is 'custom', the message the digital human says first
        dynamic:
          type: boolean
          title: Dynamic
          description: 'When speaks_first is true: wait up to 5s for the agent to open; speak first only if it stays quiet. If the agent does open, the digital human yields and a mode=''custom'' message is DISCARDED, not spoken after the greeting, so on any agent that greets callers, a dynamic custom opener is never heard. Set false to speak it every time, at the top of the call and possibly over the greeting. Defaults on, so configs saved before this field existed become dynamic'
          default: true
      type: object
      required:
      - speaks_first
      title: SpeaksFirstConfig
      description: 'Configuration for whether the digital human speaks first and how.

        Stored as JSONB in Supabase (speaks_first_config).'
    ScriptedResponse:
      properties:
        match_type:
          $ref: '#/components/schemas/MatchType'
          description: How match_phrase is compared to the agent's turn. 'exact' is a fuzzy string comparison. Use it when you have the agent's literal line from a transcript, since it is stricter and costs no LLM call. 'context' asks an LLM whether the two utterances mean the same thing. Use it when the agent could phrase the same intent several ways.
        match_phrase:
          type: string
          title: Match Phrase
          description: 'An utterance the AGENT would say, which releases this response, e.g. ''Can I have your account number?''. Matching compares utterance to utterance, so a description of what the agent is doing (''the agent finished answering and is inviting another question'') never matches anything: the rule saves and silently never fires. Write the line you expect to hear. Empty string is only meaningful when the digital human has scripted_responses_ordered set, where it fires on the digital human''s next turn regardless of what the agent said.'
        response_type:
          $ref: '#/components/schemas/src__models__digital_humans__enums__ResponseType'
          description: 'Type of response: ''phrase'', ''silence'', ''dtmf'', or ''audio'''
        response_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Response Value
          description: The response text (required for 'phrase' and 'dtmf', optional for 'silence', unused for 'audio')
        scripted_response_audio_snippet_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Scripted Response Audio Snippet Url
          description: Skywatch bucket path of an uploaded audio file. AUDIO rows only — the agent downloads and plays this verbatim.
        occurrence_mode:
          $ref: '#/components/schemas/OccurrenceMode'
          description: 'When to apply: ''always'' or ''first_n''. Ignored when the digital human has scripted_responses_ordered set, where every step fires exactly once regardless.'
        occurrence_n:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Occurrence N
          description: Number of times to apply (required if occurrence_mode is 'first_n', must be > 0)
        silence_duration:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Silence Duration
          description: Duration in seconds for silence period (only used when response_type is 'silence', must be > 0 if provided)
      type: object
      required:
      - match_type
      - match_phrase
      - response_type
      - occurrence_mode
      title: ScriptedResponse
      description: Model for a scripted response configuration.
    CreateDigitalHumanRequest:
      properties:
        simulation_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Simulation Ids
          description: List of simulation IDs to associate with this digital human
        simulation_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Simulation Id
          description: ID of the associated simulation. Use simulation_ids instead.
          deprecated: true
        digital_human:
          $ref: '#/components/schemas/DigitalHumanRequestData'
          description: The digital human data
      type: object
      required:
      - digital_human
      title: CreateDigitalHumanRequest
      description: Request model for creating a digital human.
    SocialEngineeringRedTeamConfig:
      properties:
        batches:
          items:
            $ref: '#/components/schemas/AttackBatch'
          type: array
          title: Batches
      type: object
      title: SocialEngineeringRedTeamConfig
    UpdateDigitalHumanRequest:
      properties:
        intent:
          anyOf:
          - type: string
          - type: 'null'
          title: Intent
          description: 'The scenario the digital human enacts, in ONE OR TWO SENTENCES: what this caller wants, not how to behave. It fills one slot in a prompt that ALREADY renders traits, verbosity, fluency, a not-the-agent guardrail and end-of-call instructions, so restating those here is duplicate prompt. Anything shaped like ''if the agent says X, do Y'' does not belong here — prose makes it non-deterministic. Move it: case facts the agent may ask for (member ID, DOB, order number) to `traits`; lines that must be said verbatim, a keypad entry, or a deliberate pause to `scripted_responses`; who opens the call to `speaks_first_config`; voice and call conditions to their own fields; and lower `creativity` for repeatability. If you reach for ''correctly'', ''appropriately'' or ''successfully'' you are describing what the AGENT should do — that goes in `success_criteria`.'
        success_criteria:
          anyOf:
          - type: string
          - type: 'null'
          title: Success Criteria
          description: 'The pass/fail condition for this one test, in ONE OR TWO observable outcomes the transcript can settle. Not a rubric: a scored checklist, a per-dimension score, or anything you want graded on every call in the suite belongs in a custom metric (`create_custom_metrics`), not in this string. Describe the AGENT''s outcome, never the digital human''s own actions — those are `intent`.'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Name of the digital human
        tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
          description: Tag for categorizing the digital human
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Full tag list, replacing the current tags; [] clears them. Takes precedence over `tag`, where an empty string leaves tags unchanged.
        type:
          anyOf:
          - $ref: '#/components/schemas/DigitalHumanType'
          - type: 'null'
          description: What kind of digital human this is. Set it instead of putting sentinel values in tags; tags are free-form labels. Legacy sentinel tags (e.g. 'voicemail-custom', or 'transcript_generated' + 'smart') still set it when this is omitted.
        language:
          anyOf:
          - $ref: '#/components/schemas/LanguageType'
          - type: 'null'
          description: Language the digital human speaks
        accent:
          anyOf:
          - $ref: '#/components/schemas/AccentType'
          - type: 'null'
          description: Accent of the digital human
        gender:
          anyOf:
          - $ref: '#/components/schemas/GenderType'
          - type: 'null'
          description: Gender of the digital human
        custom_voice_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Voice Id
          description: ElevenLabs voice_id of a cloned voice. Send empty string or null to clear and revert to the stock accent voice.
        background_noise:
          anyOf:
          - $ref: '#/components/schemas/BackgroundNoiseType'
          - type: 'null'
          description: Type of background noise
        custom_background_noise_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Background Noise Url
          description: Bucket-relative path of the uploaded custom background noise audio; required when background_noise is 'custom'
        voice_speed:
          anyOf:
          - $ref: '#/components/schemas/VoiceSpeedType'
          - type: 'null'
          description: Speed of the digital human's voice
        audio_quality:
          anyOf:
          - $ref: '#/components/schemas/AudioQualityType'
          - type: 'null'
          description: Audio quality of the digital human's voice
        fluency:
          anyOf:
          - $ref: '#/components/schemas/FluencyType'
          - type: 'null'
          description: Fluency level of the digital human's speech
        verbosity:
          anyOf:
          - $ref: '#/components/schemas/VerbosityType'
          - type: 'null'
          description: Verbosity level of the digital human's responses
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: Phone number for the digital human
        extension:
          anyOf:
          - type: string
          - type: 'null'
          title: Extension
          description: Extension dialed as DTMF after connecting when this DH calls an inbound agent. Send null or an empty string to clear it.
        outbound_text_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Outbound Text Number
          description: Outbound text number
        follow_up_sms_success_criteria:
          anyOf:
          - type: string
          - type: 'null'
          title: Follow Up Sms Success Criteria
          description: Criteria the captured follow-up SMS is graded against
        background_noise_volume:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Background Noise Volume
          description: Volume of background noise
        expected_tool_calls:
          anyOf:
          - items:
              $ref: '#/components/schemas/ExpectedToolCall'
            type: array
          - type: 'null'
          title: Expected Tool Calls
          description: Expected tool call outputs
        allow_end_call_tool:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow End Call Tool
          description: Allow the digital human to end the tool call
        allow_silence_tool:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Silence Tool
          description: Allow the digital human to use the silence tool
        allow_dtmf_tool:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Dtmf Tool
          description: Allow the digital human to use the DTMF tool
        default_dtmf_or_voiced:
          anyOf:
          - $ref: '#/components/schemas/DtmfOrVoicedType'
          - type: 'null'
          description: Controls whether the agent submits numerical values via DTMF or voice. 'voiced' = speak numbers (default), 'dtmf' = use DTMF tones for eligible numerical inputs
        silence_tool_instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Silence Tool Instructions
          description: Tool instructions; set to "default" for built-in behavior or custom text
        endpointing_delay:
          anyOf:
          - type: number
          - type: 'null'
          title: Endpointing Delay
          description: Seconds the digital human waits before it replies. Named patience in the UI, and accepted under either name.
        creativity:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Creativity
          description: Model temperature for the digital human's own speech. Lower it (0.0-0.3) when you want the same call twice — regression tests and anything compared run over run. Keep near the 0.7 default for exploratory or red-team cases.
        hangup_phrases:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Hangup Phrases
          description: Phrases that trigger hangup
        hangup_instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Hangup Instructions
          description: Freeform instructions for how/when to hang up. Omit the field to leave the stored value alone; send the literal string "default" to reset to the tuned built-in end-of-call behavior, which already handles ordinary goodbyes. Any other string REPLACES it, so write one only for a condition the default would miss.
        silence_timeout:
          anyOf:
          - type: integer
            minimum: 15.0
          - type: 'null'
          title: Silence Timeout
          description: Silence timeout in seconds
        simulation_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Simulation Ids
          description: Array of simulation IDs to associate with this digital human. If provided, completely replaces existing associations.
        traits:
          anyOf:
          - items:
              $ref: '#/components/schemas/src__models__traits__trait__Trait'
            type: array
          - type: 'null'
          title: Traits
          description: 'Case facts THIS CALLER holds and can recite when the agent asks — member ID, DOB, order number, policy number, zip. Traits are the determinism lever: any case-specific value written into `intent` prose should be a trait instead. NOT a place for internal or agent-side information (what the CRM holds, what the agent should say or look up, expected tool arguments, grader notes) — a caller cannot know those, and the schema has no notion of an internal trait. If provided, updates the listed traits. Unlisted traits stay unless traits_mode is "replace". Call list_digital_humans or get_digital_human first to read stored traits.'
        traits_mode:
          anyOf:
          - type: string
            enum:
            - replace
            - merge
          - type: 'null'
          title: Traits Mode
          description: How `traits` apply when you send traits on an update. Omitted or "merge" upserts only the listed traits by trait_name and keeps every other stored trait. "replace" deletes all stored traits first, then writes only the list — use this to remove traits or to set the full trait set from scratch.
        interruptions:
          anyOf:
          - $ref: '#/components/schemas/SimpleInterruptionConfig'
          - $ref: '#/components/schemas/KeywordsInterruptionConfig'
          - $ref: '#/components/schemas/ContextualInterruptionConfig'
          - type: 'null'
          title: Interruptions
          description: Interruption configuration for the digital human. If provided, completely replaces existing interruption config.
        scripted_responses:
          anyOf:
          - items:
              $ref: '#/components/schemas/ScriptedResponse'
            type: array
          - type: 'null'
          title: Scripted Responses
          description: The 'if the agent says X, the caller does Y' rules for this test, as data instead of prose — a verbatim line, a keypad entry (DTMF), or a deliberate silence. Writing the same rule into `intent` makes it advisory; putting it here makes it deterministic. If provided, completely replaces existing scripted responses.
        scripted_responses_ordered:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Scripted Responses Ordered
          description: 'When true, scripted_responses run as a script in list order: only the next unfired one is armed, each fires once, and a blank match_phrase fires on the digital human''s next turn. When false any scripted response fires whenever its match_phrase comes up.'
        role_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Role Description
          description: 'Who this caller is, in one short line. Identity and disposition only: what they are calling about is `intent`, the facts they can recite are `traits`, how they sound is language/accent/fluency/verbosity. Never internal or agent-side information — the digital human only knows what a real caller would know.'
        speaks_first_config:
          anyOf:
          - $ref: '#/components/schemas/SpeaksFirstConfig'
          - type: 'null'
          description: 'Who opens the call, and the caller''s opening line when it must be fixed — owns the opener so `intent` does not have to describe it. Read the `dynamic` field before setting a custom message: on an agent that greets callers, a dynamic custom opener is discarded. If provided, completely replaces existing speaks first config.'
        original_transcript:
          anyOf:
          - type: string
          - type: 'null'
          title: Original Transcript
          description: Original transcript text. If changed from the current value, utterances are re-extracted and the intent is regenerated.
        formatted_transcript:
          anyOf:
          - items:
              additionalProperties:
                type: string
              type: object
            type: array
          - type: 'null'
          title: Formatted Transcript
          description: Pre-computed structured transcript as [{role, utterance}]. When provided alongside original_transcript, skips the LLM formatting call.
        enriched_playback:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Enriched Playback
          description: 'Optional enriched playback stored as JSONB: a list of turn objects'
        num_runs:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Num Runs
          description: Number of times this digital human is run per simulation run (run count).
        livekit_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Livekit Metadata
          description: LiveKit-specific configuration and metadata for this digital human. If provided, completely replaces existing metadata.
        provider_request_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Provider Request Data
          description: Per-digital-human variables handed to the provider when it originates the call (Bland request_data, Vapi variableValues, Retell dynamic variables). Overrides the agent's template. If provided, completely replaces existing data; pass {} to clear.
        always_on_mode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Always On Mode
          description: Whether always-on mode is enabled for this digital human
        always_on_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Always On Active
          description: When true, this DH actively receives calls on phone_number; when false, number is assigned but inactive
        test_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Test Name
          description: User-facing label for this digital human
        journey_steps:
          anyOf:
          - items:
              $ref: '#/components/schemas/JourneyStep'
            type: array
          - type: 'null'
          title: Journey Steps
          description: Ordered journey steps. If provided, completely replaces existing journey steps.
        override_conflict:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Override Conflict
          description: When true, allows activation to replace an existing always-on active DH using the same phone number.
          default: false
        system_prompt_rule_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: System Prompt Rule Ids
          description: Ids of the system-prompt rules this digital human covers, from generate.
        system_prompt_rule_quotes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: System Prompt Rule Quotes
          description: The quoted system-prompt rules this digital human covers, shown on its card.
        workflow_v2_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workflow V2 Id
          description: Source workflow_v2 UUID — set when this DH is generated from a workflow
        workflow_path_index:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Workflow Path Index
          description: 0-based path index within enumerate_workflow_v2_paths output
        tested_path:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tested Path
          description: Ordered names of the workflow path steps this DH was generated from (Generate-From-Workflow only).
        attack_vector:
          anyOf:
          - type: string
          - type: 'null'
          title: Attack Vector
          description: Attack tactic key from VECTOR_CATALOG. NULL for non-red-team.
        attack_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Attack Type
          description: Umbrella attack category (recon | social_engineering | prompt_injection | audio_native).
        attack_plan:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Attack Plan
          description: Crescendo escalation ladder {objective, breach_predicate, ladder}.
