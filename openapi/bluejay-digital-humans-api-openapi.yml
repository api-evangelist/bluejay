    src__models__traits__trait__Trait:
      properties:
        trait_name:
          type: string
          title: Trait Name
          description: 'Name of the fact, as the agent would ask for it: ''member_id'', ''date_of_birth'', ''order_number''. Traits are org-level, so reuse the existing name across the suite rather than coining a variant. A trait is always something the CALLER knows and can say out loud — never internal or agent-side information (CRM contents, what the agent should look up or say, grader notes).'
        trait_data_type:
          $ref: '#/components/schemas/TraitDataType'
          description: BOOLEAN, STRING, DATE (ISO 8601 string) or NUMBER. Must match `value`, which is coerced to this type.
