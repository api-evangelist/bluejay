openapi: 3.2.0
info:
  title: Bluejay Issues API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Issues
paths:
  /v1/issues:
    get:
      tags:
      - Issues
      summary: List observability issues (deprecated)
      operationId: list_issues_deprecated_v1_issues_get
      deprecated: true
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: open, in_progress, resolved or ignored
          title: Status
        description: open, in_progress, resolved or ignored
      - name: priority
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: low, medium, high or urgent
          title: Priority
        description: low, medium, high or urgent
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: non_deterministic or deterministic
          title: Type
        description: non_deterministic or deterministic
      - name: assignee_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Assignee Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
                title: Response List Issues Deprecated V1 Issues Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/issues/{issue_id}:
    get:
      tags:
      - Issues
      summary: Get one observability issue (deprecated)
      operationId: get_issue_deprecated_v1_issues__issue_id__get
      deprecated: true
      security:
      - HTTPBearer: []
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Issue Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Issues
      summary: Update an observability issue (deprecated)
      operationId: update_issue_deprecated_v1_issues__issue_id__put
      deprecated: true
      security:
      - HTTPBearer: []
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Issue Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    UpdateIssueBody:
      properties:
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: open, in_progress, resolved or ignored
        priority:
          anyOf:
          - type: string
          - type: 'null'
          title: Priority
          description: low, medium, high or urgent. null leaves it untriaged.
        assignee_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Assignee Id
          description: a user in your organization. null unassigns.
        due_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due Date
          description: YYYY-MM-DD. null removes the date.
      type: object
      title: UpdateIssueBody
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Issue:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        type:
          type: string
          title: Type
          description: non_deterministic if clustered from similar failures, deterministic if recognised from a known error
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        status:
          type: string
          title: Status
          description: open, in_progress, resolved or ignored
        priority:
          anyOf:
          - type: string
          - type: 'null'
          title: Priority
          description: low, medium, high or urgent. Null until someone sets it.
        assignee_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Assignee Id
        due_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due Date
          description: null when nobody has set one
        error_source:
          type: string
          title: Error Source
          description: where the failure was recorded, e.g. tool_call
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: deterministic error code when known
        error_signature:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Signature
          description: hash or text that identifies this failure
        cluster_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Cluster Id
          description: cluster this issue was minted from
        first_seen_at:
          type: string
          format: date-time
          title: First Seen At
        last_seen_at:
          type: string
          format: date-time
          title: Last Seen At
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - type
      - title
      - description
      - status
      - error_source
      - first_seen_at
      - last_seen_at
      - created_at
      - updated_at
      title: Issue
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
