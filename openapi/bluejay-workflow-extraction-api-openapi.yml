openapi: 3.2.0
info:
  title: Bluejay Workflow Extraction API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Workflow Extraction
paths:
  /v1/workflow-extraction/uploads:
    post:
      tags:
      - Workflow Extraction
      summary: Presign Upload
      operationId: presign_upload_v1_workflow_extraction_uploads_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/workflow-extraction/uploads/download-url:
    post:
      tags:
      - Workflow Extraction
      summary: Presign Download
      description: 'Presign read access to a chat upload so the frontend can process it

        server-side (e.g. checklist test-plan ingestion) without holding S3

        credentials for the documents bucket — mirrors the org guard used by

        submit_extraction_job.'
      operationId: presign_download_v1_workflow_extraction_uploads_download_url_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignDownloadRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/workflow-extraction/jobs:
    post:
      tags:
      - Workflow Extraction
      summary: Submit Extraction Job
      operationId: submit_extraction_job_v1_workflow_extraction_jobs_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitExtractionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/workflow-extraction/jobs/{provider_job_id}:
    get:
      tags:
      - Workflow Extraction
      summary: Get Extraction Job
      operationId: get_extraction_job_v1_workflow_extraction_jobs__provider_job_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: provider_job_id
        in: path
        required: true
        schema:
          type: string
          title: Provider Job Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Extraction Job V1 Workflow Extraction Jobs  Provider Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    PresignDownloadRequest:
      properties:
        s3_key:
          type: string
          minLength: 1
          title: S3 Key
      type: object
      required:
      - s3_key
      title: PresignDownloadRequest
    PresignUploadRequest:
      properties:
        filename:
          type: string
          minLength: 1
          title: Filename
        content_type:
          type: string
          minLength: 1
          title: Content Type
        size_bytes:
          type: integer
          exclusiveMinimum: 0.0
          title: Size Bytes
      type: object
      required:
      - filename
      - content_type
      - size_bytes
      title: PresignUploadRequest
    SubmitExtractionRequest:
      properties:
        s3_key:
          anyOf:
          - type: string
          - type: 'null'
          title: S3 Key
          description: Key returned by POST /workflow-extraction/uploads
        input_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Url
          description: Presigned GET URL of the document
        correlation_id:
          type: string
          minLength: 1
          title: Correlation Id
          description: Caller's correlation id (e.g. upload id), echoed back
      type: object
      required:
      - correlation_id
      title: SubmitExtractionRequest
      description: 'Start extraction for a document, referenced either by the s3 key of a

        chat upload (preferred — the URL is presigned here) or by a caller-supplied

        presigned https URL.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
x-provenance:
  method: harvested
  publisher: Bluejay
  source: https://api.getbluejay.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
