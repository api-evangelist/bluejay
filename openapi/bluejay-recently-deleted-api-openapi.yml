openapi: 3.2.0
info:
  title: Bluejay Recently Deleted API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Recently Deleted
paths:
  /v1/recently-deleted/restore:
    post:
      summary: Restore Recently Deleted
      description: Clear the deleted flag; the item and everything under it reappears.
      operationId: restore_recently_deleted_v1_recently_deleted_restore_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentlyDeletedActionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Recently Deleted
  /v1/recently-deleted/{entity_type}/{entity_id}:
    delete:
      summary: Hard Delete Recently Deleted
      description: 'Delete now: run the destructive cleanup without waiting for the purge.'
      operationId: hard_delete_recently_deleted_v1_recently_deleted__entity_type___entity_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
          title: Entity Type
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentlyDeletedActionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Recently Deleted
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RestoreRequest:
      properties:
        entity_type:
          type: string
          title: Entity Type
        entity_id:
          type: string
          title: Entity Id
      type: object
      required:
      - entity_type
      - entity_id
      title: RestoreRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    RecentlyDeletedActionResponse:
      properties:
        entity_type:
          type: string
          title: Entity Type
        entity_id:
          type: string
          title: Entity Id
        status:
          type: string
          title: Status
      type: object
      required:
      - entity_type
      - entity_id
      - status
      title: RecentlyDeletedActionResponse
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
