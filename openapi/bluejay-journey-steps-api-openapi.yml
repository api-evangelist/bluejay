openapi: 3.2.0
info:
  title: Bluejay Journey Steps API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Journey Steps
paths:
  /v1/generate-journey-steps:
    post:
      tags:
      - Journey Steps
      summary: Generate Journey Steps Endpoint
      description: Generate a draft of journey steps for an agent from a plain-language description.
      operationId: generate_journey_steps_endpoint_v1_generate_journey_steps_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateJourneyStepsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    GenerateJourneyStepsRequest:
      properties:
        agent_id:
          type: string
          title: Agent Id
          description: ID of the agent to generate journey steps for
        description:
          type: string
          title: Description
          description: Plain-language description of the journey
        allow_sms:
          type: boolean
          title: Allow Sms
          description: Whether the agent can send SMS
          default: false
        max_steps:
          type: integer
          title: Max Steps
          description: Maximum number of steps to generate; clamped to 1-10
          default: 3
      type: object
      required:
      - agent_id
      - description
      title: GenerateJourneyStepsRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
