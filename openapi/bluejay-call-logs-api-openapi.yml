openapi: 3.2.0
info:
  title: Bluejay Call Logs API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Call Logs
paths:
  /v1/call-log-access/{call_log_id}:
    post:
      tags:
      - Call Logs
      summary: Record Call Log Click
      description: 'Record that the authenticated user opened (clicked into) a specific call log.


        The frontend hits this from its row-click handler so every UI access shows

        up in ``call_log_access_audit``, even though the click itself doesn''t

        re-fetch the log. Org membership is verified before the audit row is

        written so the audit table cannot be polluted with cross-org IDs.'
      operationId: record_call_log_click_v1_call_log_access__call_log_id__post
      security:
      - HTTPBearer: []
      parameters:
      - name: call_log_id
        in: path
        required: true
        schema:
          type: string
          title: Call Log Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/retrieve-call-logs:
    get:
      tags:
      - Call Logs
      summary: Retrieve Call Logs Index
      operationId: retrieve_call_logs_index_v1_retrieve_call_logs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      parameters:
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
  /v1/retrieve-call-logs/{agent_id}:
    get:
      tags:
      - Call Logs
      summary: 'Deprecated: use GET /v1/observability/conversations'
      description: Deprecated. Use GET /v1/observability/conversations, which takes the same filters plus metric and metadata filters and grouped counts.
      operationId: retrieve_call_logs_v1_retrieve_call_logs__agent_id__get
      deprecated: true
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Label of the agent to filter by
          title: Label
        description: Label of the agent to filter by
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max calls per page
          default: 20
          title: Page Size
        description: Max calls per page
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page
        description: Page number (1-based)
      - name: last
        in: query
        required: false
        schema:
          enum:
          - 1day
          - 3days
          - 7days
          - 30days
          - 90days
          - all
          type: string
          description: Last X days to filter by
          default: 1day
          title: Last
        description: Last X days to filter by
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveCallLogsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/retrieve-call-log:
    get:
      tags:
      - Call Logs
      summary: Retrieve Call Log Index
      operationId: retrieve_call_log_index_v1_retrieve_call_log_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      parameters:
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
  /v1/retrieve-call-log/{call_id}:
    get:
      tags:
      - Call Logs
      summary: Retrieve Call Log
      description: Retrieve one call log by call ID.
      operationId: retrieve_call_log_v1_retrieve_call_log__call_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: call_id
        in: path
        required: true
        schema:
          type: string
          title: Call Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveCallLogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/call-log:
    delete:
      tags:
      - Call Logs
      summary: Delete Call Log Index
      operationId: delete_call_log_index_v1_call_log_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      parameters:
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
  /v1/call-log/{call_id}:
    delete:
      tags:
      - Call Logs
      summary: Delete Call Log
      description: 'Delete a specific call log given its ID.

        Validates that the user has access to the call log by checking organization membership.


        Args:

        call_id: The ID of the call to delete

        recording_only: If True, only delete the recording file and clear recording fields.

        If False (default), delete the entire call log.'
      operationId: delete_call_log_v1_call_log__call_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: call_id
        in: path
        required: true
        schema:
          type: string
          title: Call Id
      - name: recording_only
        in: query
        required: false
        schema:
          type: boolean
          description: If true, only delete the recording file and clear recording fields. If false, delete the entire call log including all data.
          default: false
          title: Recording Only
        description: If true, only delete the recording file and clear recording fields. If false, delete the entire call log including all data.
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCallLogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/log/{call_id}:
    delete:
      tags:
      - Call Logs
      summary: Delete Call Log
      description: 'Delete a specific call log given its ID.

        Validates that the user has access to the call log by checking organization membership.


        Args:

        call_id: The ID of the call to delete

        recording_only: If True, only delete the recording file and clear recording fields.

        If False (default), delete the entire call log.'
      operationId: delete_call_log_v1_log__call_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: call_id
        in: path
        required: true
        schema:
          type: string
          title: Call Id
      - name: recording_only
        in: query
        required: false
        schema:
          type: boolean
          description: If true, only delete the recording file and clear recording fields. If false, delete the entire call log including all data.
          default: false
          title: Recording Only
        description: If true, only delete the recording file and clear recording fields. If false, delete the entire call log including all data.
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCallLogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/call-logs:
    delete:
      tags:
      - Call Logs
      summary: Bulk Delete Call Logs
      description: 'Delete multiple call logs given their IDs.

        Validates that the user has access to all call logs by checking organization membership.


        Args:

        body: Request body containing a list of call IDs to delete'
      operationId: bulk_delete_call_logs_v1_call_logs_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteCallLogsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteCallLogsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CustomMetric:
      properties:
        name:
          type: string
          title: Name
          description: The name of the custom metric
        description:
          type: string
          title: Description
          description: The description of the custom metric
        response_type:
          type: string
          title: Response Type
          description: The response type of the custom metric
        response_value:
          type: string
          title: Response Value
          description: The response value of the custom metric
        reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning
          description: The reasoning of the custom metric
        min_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Min Value
          description: The minimum value of the custom metric
        max_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Value
          description: The maximum value of the custom metric
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
          description: The category of the custom metric
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: The tags of the custom metric
        scoring_guidance:
          anyOf:
          - type: string
          - type: 'null'
          title: Scoring Guidance
          description: The scoring guidance of the custom metric
        enum_options:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Enum Options
          description: The enum options of the custom metric
        human_edited:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Human Edited
          description: Whether this metric result was manually overridden by a human
        human_response_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Human Response Value
          description: Human-overridden response_value; null when no override applied
        human_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Human Reasoning
          description: Human-overridden reasoning; null when no override applied
        override_reason_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Override Reason Code
          description: 'Structured reason for the latest human override. One of: ai_hallucination, overly_strict_success_criteria, overly_strict_system_prompt, other.'
        override_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Override Notes
          description: Freeform notes from the human reviewer accompanying the latest override
        last_edited_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Edited By
          description: User id of the most recent human reviewer
        last_edited_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Edited At
          description: Timestamp of the most recent human override
      type: object
      required:
      - name
      - description
      - response_type
      - response_value
      title: Custom Metric
    RetrieveCallLogResponse:
      properties:
        call_log:
          $ref: '#/components/schemas/CallLog'
          description: Details of the retrieved call log
        credits_used:
          anyOf:
          - type: number
          - type: 'null'
          title: Credits Used
          description: Credits burned by this call. Null until usage has landed and can be priced.
        status:
          type: string
          title: Status
          description: Status of the response
          default: '200'
      type: object
      required:
      - call_log
      title: RetrieveCallLogResponse
    FillerIgnoredLatency:
      properties:
        avg_filler_ignored_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Filler Ignored Latency
          description: Average filler ignored latency
          default: 0
        p50_filler_ignored_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: P50 Filler Ignored Latency
          description: 50th percentile filler ignored latency
          default: 0
        p90_filler_ignored_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: P90 Filler Ignored Latency
          description: 90th percentile filler ignored latency
          default: 0
        p95_filler_ignored_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: P95 Filler Ignored Latency
          description: 95th percentile filler ignored latency
          default: 0
        p99_filler_ignored_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: P99 Filler Ignored Latency
          description: 99th percentile filler ignored latency
          default: 0
      type: object
      title: FillerIgnoredLatency
    MetricResult:
      properties:
        metric_name:
          type: string
          title: Metric Name
          description: Stable name of the metric, e.g. 'user_perceived_loudness'
        metric_type:
          type: string
          title: Metric Type
          description: One of int, float, boolean, enum, qualitative, json, pass_fail, yes_no
        value:
          type: string
          title: Value
          description: 'The effective value as a string: the human correction when one was applied, otherwise the model''s'
        human_edited:
          type: boolean
          title: Human Edited
          description: Whether a reviewer overrode this result
          default: false
        reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning
          description: Reasoning behind the effective value
      type: object
      required:
      - metric_name
      - metric_type
      - value
      title: MetricResult
      description: 'One metric scored on a conversation, read from `metric_results`.


        Everything the platform scores lands here, including the audio measurements that have

        no dedicated column anywhere else (perceived loudness, clipping, dropouts). `value` is a

        string for every metric_type so results of mixed types can come back in one list,

        matching GET /v1/observability/conversations/{id}.'
    ParticipantRole:
      type: string
      enum:
      - AGENT
      - USER
      - DIGITAL_HUMAN
      - agent
      - digital_human
      title: ParticipantRole
      description: Role of a participant in a call or simulated conversation.
    ConversationStatus:
      type: string
      enum:
      - INITIALIZING
      - QUEUED
      - READY
      - DISPATCHED
      - RUNNING
      - CONVERSATION_ENDED
      - EVALUATING
      - COMPLETED
      - NOT_EVALUATED
      - NO_CONNECTION
      - NO_ANSWER
      - CALL_DROPPED
      - OUT_OF_FUNDS
      - SYSTEM_ERROR
      - CUSTOM_ERROR
      - CANCELLED
      - INCOMPLETED
      - REJECTED
      - INSUFFICIENT_FUNDS
      title: ConversationStatus
      description: Enum representing the possible states of a conversation.
    Event:
      properties:
        title:
          type: string
          title: Title
          description: Title of the event
        start_offset_ms:
          type: integer
          title: Start Offset Ms
          description: Start offset of the event in milliseconds
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the event
        end_offset_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: End Offset Ms
          description: End offset of the event in milliseconds
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: List of tags associated with the event
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Additional metadata associated with the event
      type: object
      required:
      - title
      - start_offset_ms
      title: Event
      description: Pydantic model for event data
    BulkDeleteCallLogsResponse:
      properties:
        message:
          type: string
          title: Message
          description: Success message
        deleted_count:
          type: integer
          title: Deleted Count
          description: Number of calls successfully deleted
        status:
          type: string
          title: Status
          description: Status of the response
          default: '200'
      type: object
      required:
      - message
      - deleted_count
      title: BulkDeleteCallLogsResponse
    CallInterface:
      type: string
      enum:
      - PHONE
      - WEB
      title: CallInterface
      description: Enum representing the interface used for a call.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Latency:
      properties:
        avg_agent_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Agent Latency
          description: Average latency
          default: 0
        max_agent_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Agent Latency
          description: Maximum latency
          default: 0
        p50_agent_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: P50 Agent Latency
          description: 50th percentile latency
          default: 0
        p90_agent_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: P90 Agent Latency
          description: 90th percentile latency
          default: 0
        p95_agent_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: P95 Agent Latency
          description: 95th percentile latency
          default: 0
        p99_agent_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: P99 Agent Latency
          description: 99th percentile latency
          default: 0
      type: object
      title: Latency
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Evaluation:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier for the evaluation result
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When this evaluation result was created (defaults to now in UTC)
        hallucination:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Hallucination
          description: Whether the agent exhibited hallucination during the call
        hallucination_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Hallucination Reasoning
          description: Reasoning behind the hallucination, if applicable
        redundancy:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Redundancy
          description: Whether the agent exhibited redundancy during the call
        redundancy_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Redundancy Reasoning
          description: Reasoning behind the redundancy, if applicable
        agent_speak_percentage:
          anyOf:
          - type: number
          - type: 'null'
          title: Agent Speak Percentage
          description: Percentage of the call where the agent was speaking
        avg_agent_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Agent Latency
          description: Average latency of the agent's responses during the call
        latency:
          anyOf:
          - $ref: '#/components/schemas/Latency'
          - type: 'null'
          description: Latency metrics for the agent's responses
        filler_ignored_latency:
          anyOf:
          - $ref: '#/components/schemas/FillerIgnoredLatency'
          - type: 'null'
          description: Filler ignored latency metrics
        num_turns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Num Turns
          description: Total number of turns taken by the agent during the call
        call_summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Summary
          description: Summary of the call, if applicable
        custom_evals:
          anyOf:
          - items: {}
            type: array
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Custom Evals
          description: List of custom evaluations performed during the call
        custom_evals_success_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Custom Evals Success Rate
          description: Success rate of the custom evaluations performed during the call
        goal_success:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Goal Success
          description: Whether the goal was successfully achieved during the call
        goal_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Goal Reasoning
          description: Reasoning behind the goal success, if applicable
        pronunciation_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Pronunciation Score
          description: Pronunciation score of the agent during the call
        pronunciation_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Pronunciation Reasoning
          description: Reasoning behind the pronunciation score, if applicable
        sentiment_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Sentiment Label
          description: Overall sentiment label for customer utterances
        sentiment_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Sentiment Score
          description: Overall sentiment score for customer utterances
        sentiment_scores:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Sentiment Scores
          description: Per-label sentiment scores for customer utterances
        custom_metrics:
          anyOf:
          - items:
              $ref: '#/components/schemas/CustomMetric'
            type: array
          - type: 'null'
          title: Custom Metrics
          description: Custom metrics associated with the evaluation
        human_edited:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Human Edited
          description: Whether any result in this evaluation was manually overridden by a human
        human_goal_success:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Human Goal Success
          description: Human-overridden goal_success; null when no override applied
        human_goal_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Human Goal Reasoning
          description: Human-overridden goal_reasoning; null when no override applied
        human_hallucination:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Human Hallucination
          description: Human-overridden hallucination verdict; null when no override applied
        human_hallucination_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Human Hallucination Reasoning
          description: Human-overridden hallucination reasoning; null when no override applied
        human_redundancy:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Human Redundancy
          description: Human-overridden redundancy verdict; null when no override applied
