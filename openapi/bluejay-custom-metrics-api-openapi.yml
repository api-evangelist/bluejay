  /v1/metric-settings:
    get:
      tags:
      - Custom Metrics
      summary: Get Metric Settings
      description: 'Stored per-org metric enablement rows. Absent row = default (agent/user

        standard metrics on, conversation_* whole-mix variants off) — resolved by readers.'
      operationId: get_metric_settings_v1_metric_settings_get
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSettingsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Custom Metrics
      summary: Update Metric Settings
      description: 'Bulk-upsert per-org metric enablement (one row per metric_id).


        Only OPTIONAL standard metrics are toggleable (the library add/remove flow);

        always-on standards (core/system/red-team) and custom metrics are rejected.


        Org-admin only. metric_settings is deliberately organization-level: it is not one of

        the stamped tables, so a change here rewrites how EVERY workspace''s conversations are

        graded, including the judge override prompts. Gated only by authentication, any member

        of any workspace, or a workspace-pinned API key, could silently change another team''s

        eval results. The same gate workspace budgets use.'
      operationId: update_metric_settings_v1_metric_settings_put
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetricSettingsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSettingsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    MetricSettingsResponse:
      properties:
        settings:
          items:
            $ref: '#/components/schemas/MetricSettingEntry'
          type: array
          title: Settings
      type: object
      required:
      - settings
      title: MetricSettingsResponse
    src__models__metric__ResponseType:
      type: string
      enum:
      - pass_fail
      - yes_no
      - qualitative
      - quantitative
      - json
      - enum
      - int
      - float
      - boolean
      - tool_call
      title: ResponseType
      description: Enum representing the possible response types for custom metrics.
    BulkUpdateMetricsRequest:
      properties:
        metric_ids:
          items:
            type: string
          type: array
          title: Metric Ids
          description: UUIDs of custom metrics to update
        updates:
          $ref: '#/components/schemas/MetricUpdates'
          description: Fields to update (only present keys are applied; value including null is written)
      type: object
      required:
      - metric_ids
      - updates
      title: BulkUpdateMetricsRequest
      description: Request for bulk updating custom metrics (same patch applied to each metric).
    UpdateMetricRequest:
      properties:
        bluejay_as_code_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Bluejay As Code Id
          description: Stable code-addressable identifier
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Name of the custom metric
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
          description: 'LLM-judge system prompt for this metric (legacy alias: description)'
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
          description: Short plain-English description of the metric (LLM-generated)
