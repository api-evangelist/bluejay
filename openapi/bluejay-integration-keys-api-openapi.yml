openapi: 3.2.0
info:
  title: Bluejay Integration Keys API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Integration Keys
paths:
  /v1/integrations:
    get:
      tags:
      - Integration Keys
      summary: Get Integrations
      description: 'Return integration metadata for the authenticated org.

        Secret fields are returned as null with companion _set booleans.'
      operationId: get_integrations_v1_integrations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Workspace whose integrations to read; defaults to the org's default workspace
          title: Workspace Id
        description: Workspace whose integrations to read; defaults to the org's default workspace
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Integration Keys
      summary: Patch Integrations
      description: 'Update integration fields. Secret fields are encrypted before storage.

        Send null to clear a field. Only include fields that changed.

        Prefer POST /update-integrations for a typed, agent-style contract.


        When `ces_wif_config_json` is included in the payload, a background Google

        Agents sync (CES + DFCX) is kicked off fire-and-forget so the credential

        save is never blocked by a potentially slow sync.'
      operationId: patch_integrations_v1_integrations_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/get-integration-key:
    post:
      tags:
      - Integration Keys
      summary: Get Integration Key
      description: Decrypt and return a single integration secret field.
      operationId: get_integration_key_v1_get_integration_key_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationKeyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationKeyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/update-integrations:
    post:
      tags:
      - Integration Keys
      summary: Update Integrations
      description: 'Update integration fields for the authenticated org (middleware encrypts secrets before DB write).

        Same semantics as PATCH /integrations: only send fields to change; null clears a field.'
      operationId: update_integrations_v1_update_integrations_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/regenerate-livekit-webhook-token:
    post:
      tags:
      - Integration Keys
      summary: Regenerate Livekit Webhook Token
      description: Mint a fresh LiveKit webhook token (part of URL) for one workspace, rotating any existing one.
      operationId: regenerate_livekit_webhook_token_v1_regenerate_livekit_webhook_token_post
      security:
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Workspace whose LiveKit webhook token to rotate; defaults to the org's default workspace
          title: Workspace Id
        description: Workspace whose LiveKit webhook token to rotate; defaults to the org's default workspace
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegenerateLiveKitTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    RegenerateLiveKitTokenResponse:
      properties:
        livekit_webhook_token:
          type: string
          title: Livekit Webhook Token
          description: The freshly minted per-org webhook token
      type: object
      required:
      - livekit_webhook_token
      title: RegenerateLiveKitTokenResponse
    IntegrationsUpdateResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Whether the update succeeded
          default: true
        message:
          type: string
          title: Message
          description: Human-readable result message
        status:
          type: string
          title: Status
          description: Status code string for clients
          default: '200'
        integrations:
          additionalProperties: true
          type: object
          title: Integrations
          description: Current integration row with secrets masked (same shape as GET /integrations)
      type: object
      required:
      - message
      - integrations
      title: IntegrationsUpdateResponse
    IntegrationKeyResponse:
      properties:
        value:
          type: string
          title: Value
          description: The decrypted plaintext value
      type: object
      required:
      - value
      title: IntegrationKeyResponse
    IntegrationKeyRequest:
      properties:
        field:
          type: string
          title: Field
          description: The secret field name to retrieve
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
          description: Workspace whose integrations row to read; defaults to the org's default workspace
      type: object
      required:
      - field
      title: IntegrationKeyRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
