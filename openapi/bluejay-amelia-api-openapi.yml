openapi: 3.2.0
info:
  title: Bluejay Amelia API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Amelia
paths:
  /v1/integrations/amelia/domains:
    get:
      tags:
      - Amelia
      summary: List Amelia Domains
      description: 'Domains the credentials can see. Amelia shows a domain''s name but its code is what

        identifies it, and the code is not in the UI, so the picker maps one to the other.'
      operationId: list_amelia_domains_v1_integrations_amelia_domains_get
      security:
      - HTTPBearer: []
      parameters:
      - name: base_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Overrides the org's stored Amelia URL
          title: Base Url
        description: Overrides the org's stored Amelia URL
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Amelia Domains V1 Integrations Amelia Domains Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/integrations/amelia/flows:
    get:
      tags:
      - Amelia
      summary: List Amelia Flows
      description: Flow names in one domain. Powers the flow picker on the Amelia connection form.
      operationId: list_amelia_flows_v1_integrations_amelia_flows_get
      security:
      - HTTPBearer: []
      parameters:
      - name: domain_code
        in: query
        required: true
        schema:
          type: string
          description: Amelia domain code the agent points at
          title: Domain Code
        description: Amelia domain code the agent points at
      - name: base_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Overrides the org's stored Amelia URL
          title: Base Url
        description: Overrides the org's stored Amelia URL
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Amelia Flows V1 Integrations Amelia Flows Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/integrations/amelia/agents:
    get:
      tags:
      - Amelia
      summary: List Amelia Agents
      description: 'Cognitive agent names in one domain, for the picker on the Amelia connection form.


        `status` is the latest revision''s, and is reported only so the form can show it: on a live

        tenant almost every agent reads UNDEPLOYED while still serving traffic, so it must not be

        used to filter the list.'
      operationId: list_amelia_agents_v1_integrations_amelia_agents_get
      security:
      - HTTPBearer: []
      parameters:
      - name: domain_code
        in: query
        required: true
        schema:
          type: string
          description: Amelia domain code the agent points at
          title: Domain Code
        description: Amelia domain code the agent points at
      - name: base_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Overrides the org's stored Amelia URL
          title: Base Url
        description: Overrides the org's stored Amelia URL
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Amelia Agents V1 Integrations Amelia Agents Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/integrations/amelia/sync:
    post:
      tags:
      - Amelia
      summary: Sync Amelia Agents
      description: 'Import the org''s Amelia cognitive agents, then re-pull what Bluejay already tracks.


        Every cognitive agent the credentials can see becomes a Bluejay agent, deduped on the Amelia

        agent''s uuid. Flows are not a roster: a domain''s flows are components of one bot, so a flow is

        only ever refreshed on an agent that already names one. Agents missing a domain code, or naming

        neither a flow nor a cognitive agent, are skipped rather than failed, so one unconfigured agent

        can''t block the rest.'
      operationId: sync_amelia_agents_v1_integrations_amelia_sync_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Sync Amelia Agents V1 Integrations Amelia Sync Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
x-provenance:
  method: harvested
  publisher: Bluejay
  source: https://api.getbluejay.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
