          title: Bland Pathway Id
        bland_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Bland Agent Id
        bland_persona_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Bland Persona Id
        bland_call_settings:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Bland Call Settings
        provider_request_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Provider Request Data
        sierra_agent_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Sierra Agent Token
        sierra_release:
          anyOf:
          - type: string
          - type: 'null'
          title: Sierra Release
        sierra_agent_parameters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Sierra Agent Parameters
        kore_host:
          anyOf:
          - type: string
          - type: 'null'
          title: Kore Host
        kore_bot_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Kore Bot Id
        kore_client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Kore Client Id
        kore_client_secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Kore Client Secret
        openai_base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Openai Base Url
        openai_api_key:
          anyOf:
          - type: string
          - type: 'null'
