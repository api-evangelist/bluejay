          title: Ces App Id
        ces_deployment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Ces Deployment Id
        dfcx_project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dfcx Project Id
        dfcx_location:
          anyOf:
          - type: string
          - type: 'null'
          title: Dfcx Location
        dfcx_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dfcx Agent Id
        amelia_base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Amelia Base Url
        amelia_domain_code:
          anyOf:
