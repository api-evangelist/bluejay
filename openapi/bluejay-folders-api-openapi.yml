          anyOf:
          - type: boolean
          - type: 'null'
          title: Simulations Disabled
          default: false
        workflow:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Workflow
        provider:
          anyOf:
          - $ref: '#/components/schemas/Provider'
          - type: 'null'
        red_team_profile:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Red Team Profile
      type: object
      required:
      - name
      - agent_description
      - organization_id
      - mode
      title: AgentPydantic
    Provider:
      type: string
      enum:
      - CUSTOM
      - ELEVENLABS
      - VAPI
      - RETELL
      - GOOGLE_CES_VOICE
      - GOOGLE_CES_CHAT
      - GOOGLE_DFCX_VOICE
      - GOOGLE_DFCX_CHAT
      - AMELIA
      - BLAND
      title: Provider
      description: 'Source platform the agent''s definition (system prompt, workflow) comes from.


        Distinct from `voice_provider` (TTS/STT vendor) and `provider_id` (handle on that vendor) —

        this identifies where the agent''s *behavior* (prompt, multi-agent graph) is authored.'
    AgentMode:
      type: string
      enum:
      - VOICE
      - TEXT
      - EMAIL
      title: AgentMode
      description: Enum representing the mode of agent
    ConnectionType:
      type: string
      enum:
      - SMS
      - HTTP_WEBHOOK
      - PHONE
      - SIP
      - WEBSOCKET
      - LIVEKIT
      - PIPECAT
      - ELEVEN_LABS
      - RETELL
      - VAPI
      - KORE
      - OPENAI_CHAT
      - OPENAI_REALTIME
      - SIERRA_VOICE
      - AMELIA_CHAT
      - AMELIA_VOICE
      - GOOGLE_CES_CHAT
      - GOOGLE_CES_VOICE
      - GOOGLE_DFCX_VOICE
      - GOOGLE_DFCX_CHAT
      - BLAND_PHONE
      - BLAND_VOICE
      - BLAND_CHAT
      - EMAIL
      title: ConnectionType
      description: Enum representing the connection type of the agent
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    MoveAgentResponse:
      properties:
        agent_id:
          type: integer
          title: Agent Id
          description: ID of the agent
        folder_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Folder Id
          description: ID of the folder (null if disassociated)
        status:
          type: string
          title: Status
          description: Status of the operation
          default: success
      type: object
      required:
      - agent_id
      title: MoveAgentResponse
    AgentType:
      type: string
      enum:
      - INBOUND
      - OUTBOUND
      title: AgentType
      description: Enum representing the type of agent
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    FolderDeleteResponse:
      properties:
        folder_id:
          type: string
          format: uuid
          title: Folder Id
          description: ID of the deleted folder
        status:
          type: string
          title: Status
          description: Status of the deletion
          default: success
      type: object
      required:
      - folder_id
      title: FolderDeleteResponse
    FolderResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: ID of the folder
        name:
          type: string
          title: Name
          description: Name of the folder
        organization_id:
          type: string
          title: Organization Id
          description: Organization ID
        created_at:
          type: string
          title: Created At
          description: Timestamp when the folder was created
      type: object
      required:
      - id
      - name
      - organization_id
      - created_at
      title: FolderResponse
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
