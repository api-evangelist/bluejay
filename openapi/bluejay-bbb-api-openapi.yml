openapi: 3.2.0
info:
  title: Bluejay BBB API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: BBB
paths:
  /v1/seed-bbb-agents:
    post:
      tags:
      - BBB
      summary: Seed Bbb Agents Endpoint
      operationId: seed_bbb_agents_endpoint_v1_seed_bbb_agents_post
      parameters:
      - name: x-internal-token
        in: header
        required: false
        schema:
          type: string
          title: X-Internal-Token
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeedBbbRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/bbb-livekit-token/{secret}:
    post:
      tags:
      - BBB
      summary: Bbb Livekit Token
      description: 'Mint a room token on the shared BBB LiveKit project, dispatching the demo agent.

        The path secret is public in the agents API, so it is a route key, not a credential:

        the request must also carry the Authorization header the seeder wrote onto the agent.

        The room comes from sim_conversation_id, so a caller cannot ask for another room.'
      operationId: bbb_livekit_token_v1_bbb_livekit_token__secret__post
      parameters:
      - name: secret
        in: path
        required: true
        schema:
          type: string
          title: Secret
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          title: Authorization
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BbbTokenRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    BbbTokenRequest:
      properties:
        room_name:
          type: string
          title: Room Name
        participant_identity:
          type: string
          title: Participant Identity
        agent_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Name
        agent_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Agent Metadata
        sim_conversation_id:
          type: integer
          title: Sim Conversation Id
      type: object
      required:
      - room_name
      - participant_identity
      - sim_conversation_id
      title: BbbTokenRequest
    SeedBbbRequest:
      properties:
        organization_id:
          type: string
          title: Organization Id
      type: object
      required:
      - organization_id
      title: SeedBbbRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
