      description: Represents an observability call evaluated event.
      properties:
        id:
          description: Unique identifier for the call
          title: Id
          type: string
        agent_id:
          description: ID of the agent associated with the call
          title: Agent Id
          type: string
        external_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: External ID of the agent associated with the call
          title: External Agent Id
        recording_url:
          anyOf:
          - type: string
          - type: 'null'
          description: 'URL to the recording file (supported formats: .mp4, .wav, .m4a)'
          title: Recording Url
        start_time_utc:
          description: When the call started, in UTC
          title: Start Time Utc
          type: string
        participants:
          description: List of call participants
          items:
            $ref: '#/components/schemas/ParticipantResponse'
          title: Participants
          type: array
        call_direction:
          $ref: '#/components/schemas/CallDirection'
          default: INBOUND
          description: Direction of the call from the Agent's perspective (INBOUND or OUTBOUND)
        interface:
          $ref: '#/components/schemas/CallInterface'
          default: PHONE
          description: Interface used for the call
        status:
          $ref: '#/components/schemas/CallStatus'
          description: Current status of the call
        created_at:
          description: When this request was created (defaults to now in UTC)
          format: date-time
          title: Created At
          type: string
        transcript_url:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 'URL to the transcript file (supported formats: .txt, .json)'
          title: Transcript Url
        tool_calls:
          anyOf:
          - items:
              $ref: '#/components/schemas/ToolCall'
            type: array
          - type: 'null'
          description: List of tool calls made during the call
          title: Tool Calls
        events:
          anyOf:
          - items:
              $ref: '#/components/schemas/Event'
            type: array
          - type: 'null'
          description: List of events that occurred during the call
          title: Events
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: List of tags associated with the call
          title: Tags
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: 0
          description: Duration of the call in milliseconds
          title: Duration Ms
        evaluations:
          anyOf:
          - items:
              $ref: '#/components/schemas/Evaluation'
            type: array
          - type: 'null'
          description: List of evaluations associated with the call
          title: Evaluations
        annotations:
          anyOf:
          - items: {}
            type: array
          - type: 'null'
          default: null
          description: Annotations associated with the call
          title: Annotations
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          description: Additional metadata associated with the call
          title: Metadata
        custom_metrics:
          anyOf:
          - items: {}
            type: array
          - type: 'null'
          default: null
          deprecated: true
          description: Please use the custom metrics in the evaluations instead
          title: Custom Metrics
        conversation_ended_by:
          anyOf:
          - $ref: '#/components/schemas/ParticipantRole'
          - type: 'null'
          default: null
          description: 'Which participant role ended the conversation: ''USER'' or ''AGENT'''
        type:
          default: observability_call_evaluated
          description: Type of webhook payload
          title: Type
          type: string
      required:
      - id
      - agent_id
      - recording_url
      - start_time_utc
      - participants
      - status
      title: Observability Call Evaluated
      type: object
    Latency:
      properties:
        avg_agent_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Agent Latency
          description: Average latency
          default: 0
        max_agent_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Agent Latency
          description: Maximum latency
          default: 0
        p50_agent_latency:
          anyOf:
          - type: number
          - type: 'null'
          title: P50 Agent Latency
          description: 50th percentile latency
          default: 0
        p90_agent_latency:
          anyOf:
          - type: number
          - type: 'null'
