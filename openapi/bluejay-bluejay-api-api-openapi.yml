openapi: 3.2.0
info:
  title: Bluejay API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Bluejay API
paths: {}
webhooks:
  events_webhook:
    post:
      summary: 'Webhook: events_webhook'
      description: Upon an event on the platform, we'll send you the results to the URL you registered within the dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/WebhookSimulationResultEvaluated'
              - $ref: '#/components/schemas/WebhookObservabilityCallEvaluated'
              - $ref: '#/components/schemas/WebhookSimulationResultEnded'
              - $ref: '#/components/schemas/WebhookOutboundSimulationStarted'
              discriminator:
                propertyName: type
                mapping:
                  simulation_result_evaluated: '#/components/schemas/WebhookSimulationResultEvaluated'
                  observability_call_evaluated: '#/components/schemas/WebhookObservabilityCallEvaluated'
                  simulation_ended: '#/components/schemas/WebhookSimulationResultEnded'
                  outbound_simulation_started: '#/components/schemas/WebhookOutboundSimulationStarted'
      responses:
        '200':
          description: Webhook received successfully
      tags:
      - Bluejay API
components:
  schemas:
    Evaluation:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier for the evaluation result
        created_at:
          type: string
