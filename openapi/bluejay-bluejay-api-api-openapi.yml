      title: FillerIgnoredLatency
    WebhookSimulationResultEnded:
      $defs:
        TestResultStatus:
          description: Enum representing the possible states of a test result.
          enum:
          - INITIALIZING
          - QUEUED
          - READY
          - DISPATCHED
          - RUNNING
          - CONVERSATION_ENDED
          - EVALUATING
          - COMPLETED
          - INCOMPLETED
          - REJECTED
          - INSUFFICIENT_FUNDS
          title: TestResultStatus
          type: string
      description: Represents a simulation result ended event.
      properties:
        type:
          default: simulation_ended
          description: Type of webhook payload
          title: Type
          type: string
        id:
          description: The ID of the simulation result
          title: Id
          type: integer
        digital_human_id:
          description: The ID of the digital human
          title: Digital Human Id
          type: integer
        status:
          $ref: '#/components/schemas/TestResultStatus'
          default: CONVERSATION_ENDED
          description: The status of the simulation result
        simulation_run_id:
          description: The ID of the simulation run that this simulation result belongs to
          title: Simulation Run Id
          type: integer
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          description: The creation time of the simulation result
          title: Created At
        start_time:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          description: The start time of the simulation result
          title: Start Time
        end_time:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          description: The end time of the simulation result
          title: End Time
        duration:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: The duration of the simulation result
          title: Duration
      required:
      - id
      - digital_human_id
      - simulation_run_id
      title: Simulation Ended
      type: object
