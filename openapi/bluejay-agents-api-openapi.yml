openapi: 3.2.0
info:
  title: Bluejay Agents API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Agents
paths:
  /v1/add-agent:
    post:
      tags:
      - Agents
      summary: Add Agent
      description: Add a new agent to the system.
      operationId: add_agent_v1_add_agent_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/update-agent:
    post:
      tags:
      - Agents
      summary: Update Agent
      description: Update an existing agent in the system.
      operationId: update_agent_v1_update_agent_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/update-agent-by-external-id:
    put:
      tags:
      - Agents
      summary: Update Agent By External Id
      description: Update an existing agent in the system by external ID.
      operationId: update_agent_by_external_id_v1_update_agent_by_external_id_put
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdateWithExternalIdRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{agent_id}:
    get:
      tags:
      - Agents
      summary: Get Agent
      description: Get an agent by ID.
      operationId: get_agent_v1_agents__agent_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPydantic'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agent-by-external-id/{external_id}:
    get:
      tags:
      - Agents
      summary: Get Agent By External Id
      description: Get an agent by external ID.
      operationId: get_agent_by_external_id_v1_agent_by_external_id__external_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: external_id
        in: path
        required: true
        schema:
          type: string
          title: External Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPydantic'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/all-agents:
    get:
      tags:
      - Agents
      summary: Get All Agents
      description: Get all your agents.
      operationId: get_all_agents_v1_all_agents_get
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentPydantic'
                title: Response Get All Agents V1 All Agents Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agent/{agent_id}:
    delete:
      tags:
      - Agents
      summary: Delete Agent
      description: Delete an agent by ID.
      operationId: delete_agent_v1_agent__agent_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/generate-http-webhook-key:
    post:
      tags:
      - Agents
      summary: Generate Http Webhook Key
      description: Generate a new signing key for an HTTP agent's webhook
      operationId: generate_http_webhook_key_v1_generate_http_webhook_key_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentWebhookKeyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWebhookKeyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/get-http-webhook-key:
    post:
      tags:
      - Agents
      summary: Get Http Webhook Key
      description: Get the signing key for an HTTP agent's webhook
      operationId: get_http_webhook_key_v1_get_http_webhook_key_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentWebhookKeyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWebhookKeyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/generate-kore-inbound-token:
    post:
      tags:
      - Agents
      summary: Generate Kore Inbound Token
      description: 'Generate (or rotate) the Bluejay-provisioned access token that Kore.ai pastes into

        its Webhook channel "Access Token" field. The plaintext is returned ONCE — store it

        encrypted at rest.'
      operationId: generate_kore_inbound_token_v1_generate_kore_inbound_token_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentWebhookKeyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWebhookKeyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/get-kore-inbound-token:
    post:
      tags:
      - Agents
      summary: Get Kore Inbound Token
      description: Get the Bluejay-provisioned Kore inbound access token for an agent.
      operationId: get_kore_inbound_token_v1_get_kore_inbound_token_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentWebhookKeyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWebhookKeyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AgentWebhookKeyResponse:
      properties:
        signing_key:
          type: string
          title: Signing Key
          description: Signing key
        message:
          type: string
          title: Message
          description: Message
      type: object
      required:
      - signing_key
      - message
      title: AgentWebhookKeyResponse
      description: Response model for agent webhook key
    AgentUpdateRequest:
      properties:
        bluejay_as_code_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Bluejay As Code Id
          description: Stable code-addressable identifier
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
          description: ID of the agent to be updated
        external_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Agent Id
          description: External agent ID for the agent
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Name of the agent
        system_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: System Prompt
          description: System prompt for the agent
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: Phone number associated with the agent
        goals:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Goals
          description: List of goals for the agent
        type:
          anyOf:
          - $ref: '#/components/schemas/AgentType'
          - type: 'null'
          description: 'INBOUND: Agent receives incoming calls from customers

            OUTBOUND: Agent makes outgoing calls to customers'
        connection_type:
          anyOf:
          - $ref: '#/components/schemas/ConnectionType'
          - type: 'null'
          description: Connection type of the agent (Livekit, Websocket, etc.)
        mode:
          anyOf:
          - $ref: '#/components/schemas/AgentMode'
          - type: 'null'
          description: Modality of the agent
        keyterms:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Keyterms
          description: List of keyterms for the agent
        follow_up_sms_sender_numbers:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Follow Up Sms Sender Numbers
          description: E.164 campaign numbers authorized to send this agent's follow-up SMS
        folder:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder
          description: Name of the folder to put the agent in
        websocket_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Websocket Url
          description: WebSocket URL for real-time communication
        websocket_username:
          anyOf:
          - type: string
          - type: 'null'
          title: Websocket Username
          description: Username for WebSocket authentication
        websocket_password:
          anyOf:
          - type: string
          - type: 'null'
          title: Websocket Password
          description: Password for WebSocket authentication
        sip_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Sip Uri
          description: SIP URI for VoIP calls
        sip_username:
          anyOf:
          - type: string
          - type: 'null'
          title: Sip Username
          description: Username for SIP authentication
        sip_password:
          anyOf:
          - type: string
          - type: 'null'
          title: Sip Password
          description: Password for SIP authentication
        custom_sip_headers:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Custom Sip Headers
          description: Custom headers for SIP requests (Do not include `X-` prefix for the headers, these get added automatically)
        dynamic_sip_webhook_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Dynamic Sip Webhook Url
          description: Per-call SIP endpoint webhook. When set (SIP connection), each call fetches its destination SIP URI from this URL at dial time.
        outbound_trigger_webhook_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Outbound Trigger Webhook Url
          description: 'Customer-dialed sims: Bluejay POSTs a rendered payload to this URL at dispatch so the customer''s own flow dials their agent into the receiving digital human.'
        outbound_trigger_payload_template:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Outbound Trigger Payload Template
          description: JSON template for the outbound trigger webhook body; {{tokens}} like {{digital_human.phone_number}} are filled per call.
        redact_pii:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Redact Pii
          description: Enable/disable PII redaction
        livekit_agent_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Livekit Agent Name
          description: LiveKit agent name
        livekit_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Livekit Metadata
          description: LiveKit metadata
        livekit_customer_tool_topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Livekit Customer Tool Topic
          description: LiveKit customer tool topic
        livekit_token_webhook_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Livekit Token Webhook Url
          description: Webhook URL Bluejay calls per simulated call to fetch a LiveKit room token; alternative to storing the org's LiveKit API key/secret. Empty string clears the field.
        livekit_token_webhook_auth:
          anyOf:
          - type: string
          - type: 'null'
          title: Livekit Token Webhook Auth
          description: Value of the Authorization header Bluejay sends on the token-webhook POST (e.g. 'Bearer <token>'). Stored encrypted. Empty string clears the field.
        pipecat_agent_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Pipecat Agent Name
          description: Pipecat agent name
        pipecat_agent_configuration:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pipecat Agent Configuration
          description: Pipecat agent configuration
        pipecat_room_properties:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pipecat Room Properties
          description: Pipecat room properties
        http_webhook:
          anyOf:
          - type: string
          - type: 'null'
          title: Http Webhook
          description: HTTP webhook URL for text agent communication
        http_webhook_sync_reply:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Http Webhook Sync Reply
          description: 'HTTP_WEBHOOK text agents: your endpoint answers in the HTTP response body instead of calling /send-http-text-message. Bluejay reads the reply out of that response.'
        voice_provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice Provider
          description: Voice provider for the agent
        provider_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Id
          description: Provider ID for the agent
        eleven_labs_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Eleven Labs Agent Id
          description: ElevenLabs Convai agent_id (for ELEVEN_LABS connection type; the xi-api-key lives in the org's integrations row)
        retell_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Retell Agent Id
          description: Retell agent_id (for RETELL connection type; the retell_key lives in the org's integrations row)
        vapi_assistant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Vapi Assistant Id
          description: Vapi assistant_id (for VAPI connection type; the vapi_private_key lives in the org's integrations row)
        ces_app_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Ces App Id
          description: Google CES app id (for GOOGLE_CES_VOICE / GOOGLE_CES_CHAT; the WIF JSON lives in the org's integrations row)
        ces_deployment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Ces Deployment Id
          description: Google CES deployment id (deployment is bound to a specific app version)
        dfcx_project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dfcx Project Id
          description: Google Dialogflow CX GCP project ID (for GOOGLE_DFCX_VOICE / GOOGLE_DFCX_CHAT; the WIF JSON lives in the org's integrations row)
        dfcx_location:
          anyOf:
          - type: string
          - type: 'null'
          title: Dfcx Location
          description: Google Dialogflow CX location (e.g. us-central1, global)
        dfcx_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dfcx Agent Id
          description: Google Dialogflow CX agent UUID (from the DFCX agent resource)
        amelia_base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Amelia Base Url
          description: Amelia deployment base URL including context root (e.g. https://tenant.amelia.com/Amelia)
        amelia_domain_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Amelia Domain Code
          description: Amelia domain code the conversation opens against (from /api/init -> domains[].code)
        amelia_flow_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Amelia Flow Name
          description: Which conversation flow in the Amelia domain this agent tracks (required for workflow sync)
        amelia_agent_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Amelia Agent Name
          description: Which cognitive agent in the Amelia domain this agent tracks (takes precedence over amelia_flow_name for workflow sync)
        kore_host:
          anyOf:
          - type: string
          - type: 'null'
          title: Kore Host
          description: Kore.ai platform host (e.g. https://kb.est.k8s.qa.kore.aws.spctrm.net)
        kore_bot_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Kore Bot Id
          description: Kore.ai bot ID (e.g. st-d536681d-...)
        kore_client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Kore Client Id
          description: Kore.ai webhook app Client ID (cs-...)
        kore_client_secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Kore Client Secret
          description: Kore.ai webhook app Client Secret (HS256); stored encrypted
        openai_base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Openai Base Url
          description: Base URL of an OpenAI-compatible API, e.g. https://example.com/v1; the driver appends /chat/completions
        openai_api_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Openai Api Key
          description: Bearer key for OPENAI_CHAT or OPENAI_REALTIME; stored encrypted. Omit for an agent behind no auth
        openai_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Openai Model
          description: Model name sent in the request; many compatible servers ignore it
        openai_realtime_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Openai Realtime Url
          description: OpenAI Realtime wss endpoint (for OPENAI_REALTIME); defaults to OpenAI's own, set it for Azure or a self-hosted server
        openai_realtime_session:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Openai Realtime Session
          description: 'Merged into the bridge''s session.update: instructions, voice, turn_detection, tools. Audio formats are set by Bluejay and cannot be overridden'
        openai_prompt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Openai Prompt Id
          description: Stored OpenAI prompt the agent is built from (pmpt_...). Referencing it tests the agent itself; pasting its instructions into openai_realtime_session tests a copy
        openai_prompt_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Openai Prompt Version
          description: Prompt version to pin. Omit to open whatever the prompt's current revision is
        email_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Email Address
          description: 'EMAIL connection: the customer agent''s inbox the digital human emails'
        email_reply_addresses:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Email Reply Addresses
          description: 'EMAIL connection: other addresses the customer agent may reply from. The digital human always writes to email_address; a reply from any listed address is accepted once it authenticates.'
        bland_pathway_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Bland Pathway Id
          description: Bland pathway id the agent runs (for BLAND_VOICE / BLAND_CHAT; the bland_api_key lives in the org's integrations row)
        bland_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Bland Agent Id
          description: 'Bland web agent id bound to the pathway (required for BLAND_VOICE: a pathway itself cannot be dialled)'
        sierra_agent_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Sierra Agent Token
          description: 'Sierra agent token: the URL path segment naming the agent in the Sierra Voice Protocol (for SIERRA_VOICE; the org''s headless API token lives in the integrations row)'
        sierra_release:
          anyOf:
          - type: string
          - type: 'null'
          title: Sierra Release
