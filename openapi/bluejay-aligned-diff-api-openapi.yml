openapi: 3.2.0
info:
  title: Bluejay Aligned Diff API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Aligned Diff
paths:
  /v1/recalculate-aligned-diff/{sim_conversation_id}:
    post:
      tags:
      - Aligned Diff
      summary: Recalculate Aligned Diff
      description: 'Trigger aligned-diff recomputation for a simulation conversation that has both

        transcript paths set but is missing aligned_diff (e.g. due to a race condition

        during ingestion).


        Returns 200 if already computed, 202 if queued.'
      operationId: recalculate_aligned_diff_v1_recalculate_aligned_diff__sim_conversation_id__post
      security:
      - HTTPBearer: []
      parameters:
      - name: sim_conversation_id
        in: path
        required: true
        schema:
          type: integer
          title: Sim Conversation Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecalculateAlignedDiffResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    RecalculateAlignedDiffResponse:
      properties:
        status:
          type: string
          title: Status
        sim_conversation_id:
          type: integer
          title: Sim Conversation Id
        message:
          type: string
          title: Message
      type: object
      required:
      - status
      - sim_conversation_id
      - message
      title: RecalculateAlignedDiffResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
