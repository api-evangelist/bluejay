openapi: 3.2.0
info:
  title: Bluejay Live Transcripts API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Live Transcripts
paths:
  /v1/live-transcript/{sim_conversation_id}/history:
    get:
      tags:
      - Live Transcripts
      summary: Get Live Transcript History
      description: 'Return the buffered transcript for a conversation over plain HTTP.


        The WebSocket is best-effort/live-only; this lets the client fetch the same

        Redis-buffered transcript regardless of socket state (initial load, poll,

        or fallback when the socket can''t hold).'
      operationId: get_live_transcript_history_v1_live_transcript__sim_conversation_id__history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: sim_conversation_id
        in: path
        required: true
        schema:
          type: integer
          title: Sim Conversation Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          description: Max number of most recent messages to return
          default: 1000
          title: Limit
        description: Max number of most recent messages to return
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
x-provenance:
  method: harvested
  publisher: Bluejay
  source: https://api.getbluejay.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
