  /v1/evaluation/{evaluation_id}/goal-override:
    delete:
      tags:
      - Human Edits
      summary: Revert Goal Override
      description: Revert a goal override on the `success` metric_results row.
      operationId: revert_goal_override_v1_evaluation__evaluation_id__goal_override_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
          title: Evaluation Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
