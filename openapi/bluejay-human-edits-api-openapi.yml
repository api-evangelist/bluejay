openapi: 3.2.0
info:
  title: Bluejay Human Edits API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Human Edits
paths:
  /v1/evaluation/{evaluation_id}/custom-metric/{custom_metric_id}:
    patch:
      tags:
      - Human Edits
      summary: Override Custom Metric Result
      description: 'Override a custom metric result on its metric_results row. ``custom_metric_id`` is the

        metric_results.metric_id; the string response_value is coerced by the row''s metric_type.'
      operationId: override_custom_metric_result_v1_evaluation__evaluation_id__custom_metric__custom_metric_id__patch
      deprecated: true
      security:
      - HTTPBearer: []
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
          title: Evaluation Id
      - name: custom_metric_id
        in: path
        required: true
        schema:
          type: string
          title: Custom Metric Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideCustomMetricRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanEditResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/evaluation/{evaluation_id}/metric/{custom_metric_id}:
    patch:
      tags:
