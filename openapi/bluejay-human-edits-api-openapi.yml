                $ref: '#/components/schemas/HTTPValidationError'
  /v1/evaluation/{evaluation_id}/redundancy:
    patch:
      tags:
      - Human Edits
      summary: Override Redundancy Result
      description: Override the redundancy verdict + reasoning on the `redundancy` metric_results row.
      operationId: override_redundancy_result_v1_evaluation__evaluation_id__redundancy_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
          title: Evaluation Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRedundancyRequest'
      responses:
        '200':
          description: Successful Response
          content:
