  /v1/evaluation/{evaluation_id}/pronunciation:
    patch:
      tags:
      - Human Edits
      summary: Override Pronunciation Result
      description: 'Override the pronunciation score + reasoning on the `pronunciation` metric_results row.


        404s until evals materializes a pronunciation metric_results row for the conversation.'
      operationId: override_pronunciation_result_v1_evaluation__evaluation_id__pronunciation_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: evaluation_id
        in: path
