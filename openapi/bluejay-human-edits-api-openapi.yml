      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverridePronunciationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanEditResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/evaluation/{evaluation_id}/custom-metric/{custom_metric_id}/override:
    delete:
      tags:
      - Human Edits
      summary: Revert Custom Metric Override
      description: Revert a custom metric override by restoring its human_* columns to sentinels.
      operationId: revert_custom_metric_override_v1_evaluation__evaluation_id__custom_metric__custom_metric_id__override_delete
      deprecated: true
      security:
      - HTTPBearer: []
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
          title: Evaluation Id
      - name: custom_metric_id
        in: path
        required: true
        schema:
          type: string
          title: Custom Metric Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanEditResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/evaluation/{evaluation_id}/metric/{custom_metric_id}/override:
    delete:
      tags:
      - Human Edits
      summary: Revert Custom Metric Override
      description: Revert a custom metric override by restoring its human_* columns to sentinels.
      operationId: revert_custom_metric_override_v1_evaluation__evaluation_id__metric__custom_metric_id__override_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
          title: Evaluation Id
      - name: custom_metric_id
        in: path
        required: true
        schema:
          type: string
          title: Custom Metric Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
