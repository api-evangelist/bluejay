  /v1/evaluation/{evaluation_id}/hallucination-override:
    delete:
      tags:
      - Human Edits
      summary: Revert Hallucination Override
      description: Revert a hallucination override on the `hallucination` metric_results row.
      operationId: revert_hallucination_override_v1_evaluation__evaluation_id__hallucination_override_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
          title: Evaluation Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanEditResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/evaluation/{evaluation_id}/redundancy-override:
    delete:
      tags:
      - Human Edits
      summary: Revert Redundancy Override
      description: Revert a redundancy override on the `redundancy` metric_results row.
      operationId: revert_redundancy_override_v1_evaluation__evaluation_id__redundancy_override_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
          title: Evaluation Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanEditResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/evaluation/{evaluation_id}/pronunciation-override:
    delete:
      tags:
      - Human Edits
      summary: Revert Pronunciation Override
      description: Revert a pronunciation override on the `pronunciation` metric_results row.
      operationId: revert_pronunciation_override_v1_evaluation__evaluation_id__pronunciation_override_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
          title: Evaluation Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanEditResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HumanEditResponse:
      properties:
        status:
          type: string
          title: Status
          description: Status of the response
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Optional message providing additional information
      type: object
      title: HumanEditResponse
    OverrideGoalRequest:
      properties:
        goal_success:
          type: boolean
          title: Goal Success
          description: The manually overridden goal success value
        goal_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Goal Reasoning
          description: The manually provided reasoning for the goal override
        override_reason_code:
          type: string
          title: Override Reason Code
          description: Structured reason for the override (one of VALID_OVERRIDE_REASON_CODES)
        override_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Override Notes
          description: Freeform notes from the reviewer
      type: object
      required:
      - goal_success
      - override_reason_code
      title: OverrideGoalRequest
    OverrideCustomMetricRequest:
      properties:
        response_value:
          type: string
          title: Response Value
          description: The manually overridden response value for the custom metric
        reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning
          description: The manually provided reasoning for the override
        override_reason_code:
          type: string
          title: Override Reason Code
          description: Structured reason for the override (one of VALID_OVERRIDE_REASON_CODES)
        override_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Override Notes
          description: Freeform notes from the reviewer
      type: object
      required:
      - response_value
      - override_reason_code
      title: OverrideCustomMetricRequest
    OverridePronunciationRequest:
      properties:
        pronunciation_score:
          type: number
          title: Pronunciation Score
          description: The manually overridden pronunciation score
        pronunciation_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Pronunciation Reasoning
          description: The manually provided reasoning for the pronunciation override
        override_reason_code:
          type: string
          title: Override Reason Code
          description: Structured reason for the override (one of VALID_OVERRIDE_REASON_CODES)
        override_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Override Notes
          description: Freeform notes from the reviewer
      type: object
      required:
      - pronunciation_score
      - override_reason_code
      title: OverridePronunciationRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OverrideHallucinationRequest:
      properties:
        hallucination:
          type: boolean
          title: Hallucination
          description: The manually overridden hallucination verdict
        hallucination_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Hallucination Reasoning
          description: The manually provided reasoning for the hallucination override
        override_reason_code:
          type: string
          title: Override Reason Code
          description: Structured reason for the override (one of VALID_OVERRIDE_REASON_CODES)
        override_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Override Notes
          description: Freeform notes from the reviewer
      type: object
      required:
      - hallucination
      - override_reason_code
      title: OverrideHallucinationRequest
    OverrideRedundancyRequest:
      properties:
        redundancy:
          type: boolean
          title: Redundancy
          description: The manually overridden redundancy verdict
        redundancy_reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Redundancy Reasoning
          description: The manually provided reasoning for the redundancy override
        override_reason_code:
          type: string
          title: Override Reason Code
          description: Structured reason for the override (one of VALID_OVERRIDE_REASON_CODES)
        override_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Override Notes
          description: Freeform notes from the reviewer
      type: object
      required:
      - redundancy
      - override_reason_code
      title: OverrideRedundancyRequest
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
