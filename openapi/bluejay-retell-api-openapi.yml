openapi: 3.2.0
info:
  title: Bluejay Retell API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: retell
paths:
  /v1/integrations/retell:
    post:
      tags:
      - retell
      summary: Handle Webhook
      description: 'Handle Retell webhook events. Signature verification runs before any business logic

        (including the call_analysis wait path) so unauthenticated clients cannot elicit 200s.'
      operationId: handle_webhook_v1_integrations_retell_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      parameters:
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
