openapi: 3.2.0
info:
  title: Bluejay Agent Versions API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Agent Versions
paths:
  /v1/agents/{agent_id}/versions:
    post:
      tags:
      - Agent Versions
      summary: Create Agent Version
      description: create a new prompt version under /agents/{agent_id}/prompts/versions.
      operationId: create_agent_version_v1_agents__agent_id__versions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentVersionBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVersionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Agent Versions
      summary: List Agent Versions
      description: list prompt versions with optional filters (label, version).
      operationId: list_agent_versions_v1_agents__agent_id__versions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentVersionResponse'
                title: Response List Agent Versions V1 Agents  Agent Id  Versions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Agent Versions
      summary: Delete Agent Version By Label
      description: 'delete a prompt version by label.


        - if label is production -> 400 (must move production first)

        - if label resolves to 0 -> 404; >1 -> 400 ambiguous (except latest which should be unique)

        - if deleting latest, reassign latest to highest remaining version

        - cannot delete if it is the only version'
      operationId: delete_agent_version_by_label_v1_agents__agent_id__versions_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{agent_id}/versions/promote:
    post:
      tags:
      - Agent Versions
      summary: Promote Production Label
      description: Move the production label to the latest version, or to the version identified by version (or prompt_id).
      operationId: promote_production_label_v1_agents__agent_id__versions_promote_post
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: If set, attach the production label to this version number; otherwise attach to the latest version.
          title: Version
        description: If set, attach the production label to this version number; otherwise attach to the latest version.
      - name: prompt_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: 'Alias for version: the version''s uuid. Ignored when version is set.'
          title: Prompt Id
        description: 'Alias for version: the version''s uuid. Ignored when version is set.'
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVersionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{agent_id}/versions/{version}:
    get:
      tags:
      - Agent Versions
      summary: Get Agent Version
      operationId: get_agent_version_v1_agents__agent_id__versions__version__get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: version
        in: path
        required: true
        schema:
          type: integer
          title: Version
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVersionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Agent Versions
      summary: Delete Agent Version
      description: 'delete a specific prompt version; cannot delete production; cannot delete only version.


        if deleting latest, reassign latest to highest remaining version.

        returns metadata about the deletion.'
      operationId: delete_agent_version_v1_agents__agent_id__versions__version__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: version
        in: path
        required: true
        schema:
          type: integer
          title: Version
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{agent_id}/versions/{prompt_id}:
    get:
      tags:
      - Agent Versions
      summary: Get Agent Version By Id
      operationId: get_agent_version_by_id_v1_agents__agent_id__versions__prompt_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: prompt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Prompt Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVersionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Agent Versions
      summary: Delete Agent Version By Id
      operationId: delete_agent_version_by_id_v1_agents__agent_id__versions__prompt_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: prompt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Prompt Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{agent_id}/versions/{version}/labels:
    get:
      tags:
      - Agent Versions
      summary: List Agent Version Labels Route
      operationId: list_agent_version_labels_route_v1_agents__agent_id__versions__version__labels_get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: version
        in: path
        required: true
        schema:
          type: integer
          title: Version
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Agent Versions
      summary: Add Agent Version Labels Route
      operationId: add_agent_version_labels_route_v1_agents__agent_id__versions__version__labels_post
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: version
        in: path
        required: true
        schema:
          type: integer
          title: Version
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelDeltaRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Agent Versions
      summary: Remove Agent Version Labels Route
      operationId: remove_agent_version_labels_route_v1_agents__agent_id__versions__version__labels_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          title: Agent Id
      - name: version
        in: path
        required: true
        schema:
          type: integer
          title: Version
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelDeltaRequest'
              default:
                labels: []
                override_label: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CreateAgentVersionBody:
      properties:
        prompt_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Text
          description: Prompt content. Omit to copy the current latest version (MAX(version) / latest label) and increment. An empty string stores a blank prompt.
        commit_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Commit Message
        labels:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Labels
        override_label:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Override Label
          description: When true, a label that already points at another version (including production) moves here.
          default: false
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      type: object
      title: CreateAgentVersionBody
      description: body for agent-scoped create version endpoint (agent_id in path).
    LabelListResponse:
      properties:
        labels:
          items:
            type: string
          type: array
          title: Labels
      type: object
      title: LabelListResponse
      description: response wrapper for just a list of labels.
    LabelDeltaRequest:
      properties:
        labels:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Labels
        override_label:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Override Label
          default: false
      type: object
      title: LabelDeltaRequest
      description: 'request body for add/remove label operations.


        labels: list of labels to add or remove. empty/null means no-op for add,

        and clear-all for remove (callers decide the semantics).

        override_label: when true, adding an existing label moves its association

        to the requested resource; when false, conflicts return 409.'
    AgentVersionResponse:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
          description: the id of the prompt
        prompt_text:
          type: string
          title: Prompt Text
          description: the prompt content
        commit_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Commit Message
        labels:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Labels
          description: labels associated with the prompt
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: arbitrary JSON metadata
        version:
          type: integer
          title: Version
          description: the version number of the prompt
        agent_id:
          type: integer
          title: Agent Id
          description: id of the agent that owns this prompt
      type: object
      required:
      - prompt_text
      - version
      - agent_id
      title: AgentVersionResponse
      description: response model for prompt without created_at.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
