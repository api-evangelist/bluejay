openapi: 3.2.0
info:
  title: BluejayAI References API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: BluejayAI References
paths:
  /v1/bluejay-ai/search-references:
    get:
      tags:
      - BluejayAI References
      summary: Search References
      description: 'Substring-search (or full list when `q` is empty) across the four referenceable types within the caller''s org. Empty `q` is intentional: the frontend''s Browse-card click scopes to a type without typing, and we want to show the recent N entries for that type rather than 422.'
      operationId: search_references_v1_bluejay_ai_search_references_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Q
      - name: types
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Types
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 25
          minimum: 1
          default: 10
          title: Limit
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchReferencesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/bluejay-ai/resolve-references:
    post:
      tags:
      - BluejayAI References
      summary: Resolve References
      description: 'Fetch full row data for each {type, id} mention in the caller''s org. Permissive: never fails the whole request.'
      operationId: resolve_references_v1_bluejay_ai_resolve_references_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReferencesRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveReferencesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    UnresolvedMention:
      properties:
        type:
          type: string
          title: Type
        id:
          title: Id
        reason:
          type: string
          title: Reason
      type: object
      required:
      - type
      - id
      - reason
      title: UnresolvedMention
    SearchResultItem:
      properties:
        type:
          type: string
          title: Type
        id:
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - type
      - id
      - name
      title: SearchResultItem
    ResolveReferencesRequest:
      properties:
        mentions:
          items:
            $ref: '#/components/schemas/MentionInput'
          type: array
          maxItems: 100
          title: Mentions
      type: object
      title: ResolveReferencesRequest
    SearchReferencesResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/SearchResultItem'
          type: array
          title: Results
      type: object
      required:
      - results
      title: SearchReferencesResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    MentionInput:
      properties:
        type:
          type: string
          title: Type
        id:
          title: Id
      type: object
      required:
      - type
      - id
      title: MentionInput
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ResolveReferencesResponse:
      properties:
        resolved:
          additionalProperties:
            additionalProperties: true
            type: object
          type: object
          title: Resolved
        unresolved:
          items:
            $ref: '#/components/schemas/UnresolvedMention'
          type: array
          title: Unresolved
      type: object
      title: ResolveReferencesResponse
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
x-provenance:
  method: harvested
  publisher: Bluejay
  source: https://api.getbluejay.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
