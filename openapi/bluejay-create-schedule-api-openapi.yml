openapi: 3.2.0
info:
  title: Bluejay Create Schedule API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Create Schedule
paths:
  /v1/create-schedule:
    post:
      summary: Create Schedule
      operationId: create_schedule_v1_create_schedule_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCronJobRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCronJobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Create Schedule
components:
  schemas:
    ScheduleWindow:
      properties:
        days:
          items:
            type: string
            enum:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          type: array
          title: Days
          description: Days to run on; empty means every day
        start_time:
          anyOf:
          - type: string
            pattern: ^\d{2}:\d{2}$
          - type: 'null'
          title: Start Time
          description: HH:MM start of the daily window
        end_time:
          anyOf:
          - type: string
            pattern: ^\d{2}:\d{2}$
          - type: 'null'
          title: End Time
          description: HH:MM end of the daily window
      type: object
      title: ScheduleWindow
      description: 'Restricts a recurring schedule to certain days and/or a daily time range —

        "Mondays and Fridays", "weekdays 9am-5pm". Times are read in the schedule''s timezone.'
    EveryNMinutesSchedule:
      properties:
        window:
          anyOf:
          - $ref: '#/components/schemas/ScheduleWindow'
          - type: 'null'
        frequency:
          type: string
          const: every_n_minutes
          title: Frequency
        interval:
          type: integer
          maximum: 59.0
          exclusiveMinimum: 0.0
          title: Interval
          description: Repeat every N minutes (max 59)
      type: object
      required:
      - frequency
      - interval
      title: EveryNMinutesSchedule
    EveryNHoursSchedule:
      properties:
        window:
          anyOf:
          - $ref: '#/components/schemas/ScheduleWindow'
          - type: 'null'
        frequency:
          type: string
          const: every_n_hours
          title: Frequency
        interval:
          type: integer
          maximum: 23.0
          exclusiveMinimum: 0.0
          title: Interval
          description: Repeat every N hours (max 23)
      type: object
      required:
      - frequency
      - interval
      title: EveryNHoursSchedule
    CreateCronJobResponse:
      properties:
        id:
          type: string
          title: Id
          description: The unique identifier for the created cron job.
        simulation_id:
          type: string
          title: Simulation Id
          description: The unique identifier for the associated simulation.
        cron_expression:
          type: string
          title: Cron Expression
          description: The cron expression defining the job schedule.
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
          description: Whether the cron job is enabled.
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
          description: IANA timezone the cron expression is read in. Null means UTC.
      type: object
      required:
      - id
      - simulation_id
      - cron_expression
      title: CreateCronJobResponse
    CreateCronJobRequest:
      properties:
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
          description: IANA timezone the cron expression is read in. Null means UTC.
        simulation_id:
          type: string
          title: Simulation Id
          description: The unique identifier for the associated simulation.
        schedule:
          anyOf:
          - $ref: '#/components/schemas/EveryNMinutesSchedule'
          - $ref: '#/components/schemas/EveryNHoursSchedule'
          - $ref: '#/components/schemas/DailySchedule'
          - $ref: '#/components/schemas/WeeklySchedule'
          - $ref: '#/components/schemas/MonthlySchedule'
          - $ref: '#/components/schemas/CronSchedule'
          title: Schedule
          description: The schedule for the cron job.
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
          description: Whether the cron job should be enabled upon creation.
          default: true
      type: object
      required:
      - simulation_id
      - schedule
      title: CreateCronJobRequest
    MonthlySchedule:
      properties:
        time:
          type: string
          pattern: ^\d{2}:\d{2}$
          title: Time
          description: HH:MM 24hr time
        frequency:
          type: string
          const: monthly
          title: Frequency
        day_of_month:
          type: integer
          maximum: 31.0
          minimum: 1.0
          title: Day Of Month
      type: object
      required:
      - time
      - frequency
      - day_of_month
      title: MonthlySchedule
    DailySchedule:
      properties:
        time:
          type: string
          pattern: ^\d{2}:\d{2}$
          title: Time
          description: HH:MM 24hr time
        frequency:
          type: string
          const: daily
          title: Frequency
        window:
          anyOf:
          - $ref: '#/components/schemas/ScheduleWindow'
          - type: 'null'
      type: object
      required:
      - time
      - frequency
      title: DailySchedule
    CronSchedule:
      properties:
        frequency:
          type: string
          const: cron
          title: Frequency
        expression:
          type: string
          title: Expression
          description: Cron expression
      type: object
      required:
      - frequency
      - expression
      title: CronSchedule
    WeeklySchedule:
      properties:
        time:
          type: string
          pattern: ^\d{2}:\d{2}$
          title: Time
          description: HH:MM 24hr time
        frequency:
          type: string
          const: weekly
          title: Frequency
        day_of_week:
          type: string
          enum:
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          - sunday
          title: Day Of Week
      type: object
      required:
      - time
      - frequency
      - day_of_week
      title: WeeklySchedule
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key required to authenticate requests.
    scimToken:
      type: http
      scheme: bearer
      description: SCIM token from Settings → Security → User provisioning (SCIM). Not an API key.
x-provenance:
  method: harvested
  publisher: Bluejay
  source: https://api.getbluejay.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
