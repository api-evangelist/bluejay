openapi: 3.2.0
info:
  title: Bluejay Alerts API
  description: Bluejay API
  version: 0.1.0
servers:
- url: https://api.getbluejay.ai
  description: Production server
security:
- apiKeyAuth: []
tags:
- name: Alerts
paths:
  /v1/alerts/test-notification:
    post:
      tags:
      - Alerts
      summary: Send Test Notification
      description: Send a test notification through the alert's configured channels.
      operationId: send_test_notification_v1_alerts_test_notification_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestNotificationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestNotificationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/alerts:
    get:
      tags:
      - Alerts
      summary: Get Alerts
      description: Get all alerts for the organization, optionally filtered by source_scope
      operationId: get_alerts_v1_alerts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: source_scope
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SourceScope'
          - type: 'null'
          description: Filter alerts by source scope
          title: Source Scope
        description: Filter alerts by source scope
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertResponse'
                title: Response Get Alerts V1 Alerts Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/create-alert:
    post:
      tags:
      - Alerts
      summary: Create Alert
      description: Create a new alert with optional agent associations
      operationId: create_alert_v1_create_alert_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/update-alert/{alert_id}:
    put:
      tags:
      - Alerts
      summary: Update Alert
      description: Update an existing alert
      operationId: update_alert_v1_update_alert__alert_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Alert Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/alert/{alert_id}:
    delete:
      tags:
      - Alerts
      summary: Delete Alert
      description: Delete an alert and its agent associations
      operationId: delete_alert_v1_alert__alert_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Alert Id
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAlertResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/alerts/{alert_id}/results:
    get:
      tags:
      - Alerts
      summary: Get Alert Results
      description: 'Get an alert''s fired results (events).


        Config is read from the unified ``alerts`` table; events are read from

        ClickHouse (observability_alert_events / simulation_alerts_history) by the

        alert''s source_scope. Each result resolves to the entity that caused it: for

        simulation, the experiment (simulation) + run; for observability, the call.

        Newest-first, page-paginated; pass ``source`` to restrict to one data source.'
      operationId: get_alert_results_v1_alerts__alert_id__results_get
      security:
      - HTTPBearer: []
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Alert Id
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AlertResultsSourceFilter'
          - type: 'null'
          description: 'Filter results by source: ''simulation'' or ''observability'''
          title: Source
        description: 'Filter results by source: ''simulation'' or ''observability'''
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max results per page
          default: 20
          title: Page Size
        description: Max results per page
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page
        description: Page number (1-based)
      - name: X-Organization-Id
        in: header
        required: false
        schema:
          type: string
          title: X-Organization-Id
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
        description: API key required to authenticate requests.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResultsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    SourceScope:
      type: string
      enum:
      - all
      - observability
      - simulation
      title: SourceScope
      description: 'Allowed data source scope for when an alert fires: all, observability only, or simulation only.'
    CreateAlertRequest:
      properties:
        sample_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sample Size
          description: Evaluate over the most recent N conversations instead of a time window (minimum 30). NULL keeps the time-window behavior; the alert never fires with fewer than N conversations.
        name:
          type: string
          title: Name
          description: Name of the alert
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the alert
        is_enabled:
          type: boolean
          title: Is Enabled
          description: Whether the alert is enabled
          default: true
        entity_type:
          $ref: '#/components/schemas/EntityType'
          description: Type of entity being monitored
        entity_field:
          type: string
          title: Entity Field
          description: The specific field/metric being monitored
        operator:
          $ref: '#/components/schemas/Operator'
          description: Comparison operator
        comparison_value:
          type: string
          title: Comparison Value
          description: Value to compare against
        notification_channels:
          items:
            $ref: '#/components/schemas/NotificationChannelRequest'
          type: array
          title: Notification Channels
          description: Notification channels configuration
        applies_to_all_agents:
          type: boolean
          title: Applies To All Agents
          description: Whether the alert applies to all agents
          default: true
        agent_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Agent Ids
          description: Agent IDs to associate with this alert (only used when applies_to_all_agents=False)
        simulation_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Simulation Id
          description: Optional experiments.id (simulation) to scope simulation alerts to. NULL means agent-scoped across all simulations.
        evaluation_scope:
          anyOf:
          - type: string
            enum:
            - per_test_result
            - per_simulation_run
            - per_simulation_run_window
          - type: 'null'
          title: Evaluation Scope
          description: How this alert is evaluated. Only 'per_simulation_run' is supported.
        aggregation:
          anyOf:
          - type: string
            enum:
            - none
            - avg
            - max
            - min
            - count
          - type: 'null'
          title: Aggregation
          description: Aggregation mode used to compute the per-run metric value from test results within the run.
        threshold_time_interval:
          anyOf:
          - type: integer
          - type: 'null'
          title: Threshold Time Interval
          description: 'For observability source_scope: time window in seconds (default 600 if omitted). For simulation source_scope: K = number of recent completed runs (default 1 if omitted).'
        min_events:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Events
          description: Minimum number of events for the alert. Only meaningful for observability/all source_scope (default 10 if omitted). Forced to NULL for simulation source_scope.
        min_events_type:
          $ref: '#/components/schemas/MinEventsType'
          description: Whether min_events is an absolute count ('events') or a percentage ('percentage')
          default: events
        source_scope:
          $ref: '#/components/schemas/SourceScope'
          description: 'Which data source fires this alert: ''all'', ''observability'', or ''simulation'''
          default: all
      type: object
      required:
      - name
      - entity_type
      - entity_field
      - operator
      - comparison_value
      title: CreateAlertRequest
      description: Request model for creating an alert
    AlertResultsResponse:
      properties:
        alert_id:
          type: string
          title: Alert Id
          description: ID of the alert
        source_scope:
          type: string
          title: Source Scope
          description: Configured source scope of the alert
        results:
          items:
            $ref: '#/components/schemas/AlertEventResponse'
          type: array
          title: Results
          description: The fired events on this page, newest first
        total_count:
          type: integer
          title: Total Count
          description: Total number of events matching the filter across all pages
        page:
          type: integer
          title: Page
          description: Current page (1-based)
        page_size:
          type: integer
          title: Page Size
          description: Requested number of items per page
        items_in_page:
          type: integer
          title: Items In Page
          description: Actual number of items on this page
        total_pages:
          type: integer
          title: Total Pages
          description: Total number of pages
      type: object
      required:
      - alert_id
      - source_scope
      - results
      - total_count
      - page
      - page_size
      - items_in_page
      - total_pages
      title: AlertResultsResponse
      description: 'Paginated results (fired events) for a single alert.


        Pagination follows the same page-based convention as the other list

        endpoints (e.g. retrieve-call-logs, get-custom-metrics).'
    AlertResultsSourceFilter:
      type: string
      enum:
      - simulation
      - observability
      title: AlertResultsSourceFilter
      description: Filterable sources for the results endpoint.
    TestNotificationResponse:
      properties:
        queued:
          type: integer
          title: Queued
          description: Number of notification messages enqueued
      type: object
      required:
      - queued
      title: TestNotificationResponse
    AlertSimulationSource:
      properties:
        simulation_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Simulation Id
          description: experiments.id of the simulation the triggering run belongs to
        simulation_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Simulation Name
          description: Name of the simulation
        simulation_run_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Simulation Run Id
          description: experiment_runs.id of the specific run that caused the event
        test_result_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Test Result Id
          description: sim_conversation_id of the specific conversation that caused the event, if any
        run_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Status
          description: Status of the triggering simulation run
      type: object
      title: AlertSimulationSource
      description: The simulation entity that caused a fired alert event.
    AlertObservabilitySource:
      properties:
        call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Id
          description: conversation id of the call that caused the event
        call_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Status
          description: Status of the triggering call
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
          description: When the triggering call started
      type: object
      title: AlertObservabilitySource
      description: The observability entity (call) that caused a fired alert event.
    AlertEventResponse:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier for the alert event
        alert_id:
          type: string
          title: Alert Id
          description: ID of the alert that fired
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
          description: When the event fired
        triggered_by_entity_type:
          type: string
          title: Triggered By Entity Type
          description: Type of entity that triggered the event
        triggered_by_entity_id:
          type: string
          title: Triggered By Entity Id
          description: ID of the entity that triggered the event
        entity_field:
          type: string
          title: Entity Field
          description: The field/metric that breached the threshold
        actual_value:
          type: string
          title: Actual Value
          description: The observed value that triggered the event
        expected_value:
          type: string
          title: Expected Value
          description: The threshold value compared against
        operator_used:
          type: string
          title: Operator Used
          description: The comparison operator applied
        agent_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Agent Id
          description: Agent associated with the event
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Additional event context
        source:
          type: string
          title: Source
          description: 'Data source that caused the event: ''simulation'', ''observability'', or ''unknown'''
        simulation:
          anyOf:
          - $ref: '#/components/schemas/AlertSimulationSource'
          - type: 'null'
          description: Simulation source details (set when source='simulation')
        observability:
          anyOf:
          - $ref: '#/components/schemas/AlertObservabilitySource'
          - type: 'null'
          description: Observability source details (set when source='observability')
      type: object
      required:
      - id
      - alert_id
      - triggered_by_entity_type
      - triggered_by_entity_id
      - entity_field
      - actual_value
      - expected_value
      - operator_used
      - source
      title: AlertEventResponse
      description: A single fired alert event, resolved to the entity that caused it.
    NotificationChannelRequest:
      properties:
        type:
          type: string
          title: Type
          description: 'Type of notification: ''email'', ''slack'', ''webhook'', ''pagerduty'', or ''betterstack'''
        target:
          type: string
          title: Target
          description: Target for the notification (email address, slack channel, webhook URL, or PagerDuty routing key; ignored for betterstack, which uses the org's API token)
      type: object
      required:
      - type
      - target
      title: NotificationChannelRequest
      description: Notification channel configuration
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    UpdateAlertRequest:
      properties:
        sample_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sample Size
          description: Evaluate over the most recent N conversations instead of a time window (minimum 30). NULL keeps the time-window behavior; the alert never fires with fewer than N conversations.
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Name of the alert
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the alert
        is_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Enabled
          description: Whether the alert is enabled
        entity_type:
          anyOf:
          - $ref: '#/components/schemas/EntityType'
          - type: 'null'
          description: Type of entity being monitored
        entity_field:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Field
          description: The specific field/metric being monitored
        operator:
          anyOf:
          - $ref: '#/components/schemas/Operator'
          - type: 'null'
          description: Comparison operator
        comparison_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Comparison Value
          description: Value to compare against
        notification_channels:
          anyOf:
          - items:
              $ref: '#/components/schemas/NotificationChannelRequest'
            type: array
          - type: 'null'
          title: Notification Channels
          description: Notification channels configuration
        applies_to_all_agents:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Applies To All Agents
          description: Whether the alert applies to all agents
        agent_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Agent Ids
          description: Agent IDs to associate with this alert
        simulation_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Simulation Id
          description: Optional experiments.id (simulation) to scope simulation alerts to. Set to null to clear and make the alert agent-scoped.
        evaluation_scope:
          anyOf:
          - type: string
            enum:
            - per_test_result
            - per_simulation_run
            - per_simulation_run_window
          - type: 'null'
          title: Evaluation Scope
          description: How this alert is evaluated. Only 'per_simulation_run' is supported.
        aggregation:
          anyOf:
          - type: string
            enum:
            - none
            - avg
            - max
            - min
            - count
          - type: 'null'
          title: Aggregation
          description: Aggregation mode used to compute the per-run metric value from test results within the run.
        threshold_time_interval:
          anyOf:
          - type: integer
          - type: 'null'
          title: Threshold Time Interval
          description: Number of recent completed runs (K). Alert fires if all K runs individually met the condition.
        min_events:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Events
          description: Minimum number of events to trigger the alert
        min_events_type:
          anyOf:
          - $ref: '#/components/schemas/MinEventsType'
          - type: 'null'
          description: Whether min_events is an absolute count ('events') or a percentage ('percentage')
        source_scope:
          anyOf:
          - $ref: '#/components/schemas/SourceScope'
          - type: 'null'
          description: 'Which data source fires this alert: ''all'', ''observability'', or ''simulation'''
      type: object
      title: UpdateAlertRequest
      description: Request model for updating an alert
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AlertResponse:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier for the alert
        name:
          type: string
          title: Name
          description: Name of the alert
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the alert
        is_enabled:
          type: boolean
          title: Is Enabled
          description: Whether the alert is enabled
        organization_id:
          type: string
          title: Organization Id
          description: Organization ID
        entity_type:
          $ref: '#/components/schemas/EntityType'
          description: Type of entity being monitored
        entity_field:
          type: string
          title: Entity Field
          description: The specific field/metric being monitored
        operator:
          $ref: '#/components/schemas/Operator'
          description: Comparison operator
        comparison_value:
          type: string
          title: Comparison Value
          description: Value to compare against
        notification_channels:
          items: {}
          type: array
          title: Notification Channels
          description: Notification channels configuration
        last_triggered_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Triggered At
          description: When the alert was last triggered
        trigger_count:
          type: integer
          title: Trigger Count
          description: Number of times triggered
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
          description: User who created the alert
        applies_to_all_agents:
          type: boolean
          title: Applies To All Agents
          description: Whether the alert applies to all agents
        agents:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Agents
          description: Associated agent IDs
        simulation_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Simulation Id
          description: Optional experiments.id (simulation) this alert is scoped to
        evaluation_scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Evaluation Scope
          description: How this alert is evaluated. Only 'per_simulation_run' is supported.
        aggregation:
          anyOf:
          - type: string
          - type: 'null'
          title: Aggregation
          description: Aggregation mode used to compute the per-run metric value from test results within the run.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the alert was created
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
          description: When the alert was last updated
        updated_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated By
          description: User who last updated the alert
        threshold_time_interval:
          anyOf:
          - type: integer
          - type: 'null'
          title: Threshold Time Interval
          description: 'For observability source_scope: time window in seconds. For simulation source_scope: K = number of recent completed runs.'
        min_events:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Events
          description: The minimum number of events for the alert. NULL for simulation alerts.
        min_events_type:
          type: string
          title: Min Events Type
          description: Whether min_events is an absolute count or a percentage
          default: events
        in_alert:
          type: boolean
          title: In Alert
          description: Whether the alert is in alert
        source_scope:
          type: string
          title: Source Scope
          description: 'Which data source fires this alert: ''all'', ''observability'', or ''simulation'''
          default: all
        simulation_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Simulation Name
          description: Name of the simulation (experiment) this alert is scoped to, if any
        sample_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sample Size
          description: Most recent N conversations the alert is evaluated over; NULL = time window
      type: object
      required:
      - id
      - name
      - is_enabled
      - organization_id
      - entity_type
      - entity_field
      - operator
      - comparison_value
