aid: bluejay
name: Bluejay
description: >-
  Bluejay is the testing, monitoring, and improvement layer for conversational
  AI agents. Enterprises, startups, and developers use Bluejay to evaluate voice
  and chat agents, run lifelike simulations with synthetic "digital humans"
  across voice, chat, SMS, and text channels, load-test and replay production
  calls, and catch regressions before they reach customers. The platform pairs a
  simulation engine with production observability - automated evaluation of tone,
  accuracy, task completion, and custom metrics, plus dashboards and alerts. It
  exposes a REST API (X-API-Key auth, /v1), a hosted MCP server, event webhooks,
  a first-party Python SDK, and integrations with Vapi, Retell, ElevenLabs,
  Bland, LiveKit, Google Dialogflow CX / CES, and Kore.ai. Backed by Homebrew.
url: https://raw.githubusercontent.com/api-evangelist/bluejay/refs/heads/main/apis.yml
